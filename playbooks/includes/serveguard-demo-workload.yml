---
# The ServeGuard workload, from the serveguard.openshift_ai collection, in the
# order of the paper's trust model. Each role checks its own pre- and
# postconditions, skips what already holds and stops on conflicts; this file only
# asserts on their results. Workload variables (serveguard_predictor_cpu, ...)
# are the collection's role defaults; a scenario or -e that sets one is passed through.

- name: Workload preflight
  ansible.builtin.include_role:
    name: serveguard.openshift_ai.preflight

- name: Trust anchor (pinned base and package identity)
  ansible.builtin.include_role:
    name: serveguard.openshift_ai.trust_anchor

- name: Receiver image
  ansible.builtin.include_role:
    name: serveguard.openshift_ai.receiver_image

- name: Publisher (adapter, certificate, commitment)
  ansible.builtin.include_role:
    name: serveguard.openshift_ai.publisher

- name: Public verifier (admission)
  ansible.builtin.include_role:
    name: serveguard.openshift_ai.public_verifier

- name: Serving consumer (admitted InferenceService)
  ansible.builtin.include_role:
    name: serveguard.openshift_ai.serving_consumer

- name: Verify the admitted service
  ansible.builtin.include_role:
    name: serveguard_checks
    tasks_from: assert_serving

- name: Stories
  when: serveguard_run_stories | bool
  block:
    - name: Run the stories
      ansible.builtin.include_role:
        name: serveguard.openshift_ai.stories

    - name: The admitted service survived the stories with the same adapter digest
      ansible.builtin.include_role:
        name: serveguard_checks
        tasks_from: assert_serving
      vars:
        _sg_digest_before: "{{ _sg_admitted_digest }}"
  always:
    - name: Story banner
      ansible.builtin.include_role:
        name: serveguard_checks
        tasks_from: stories_banner
      when: serveguard_stories_result is defined
