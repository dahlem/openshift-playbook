---
# Version constraints for the deployment stack.
# Similar to pyproject.toml — declares what we need and
# the preflight role resolves whether the constraints can be met.

cluster:
  openshift_version: "4.21.3"  # exact version to deploy
  rosa_cli: ">=1.2.60"
  oc_cli: ">=4.17"

operators:
  nfd:
    channel: stable
    source: redhat-operators
    package: nfd
  gpu:
    channel: v25.3
    source: certified-operators
    package: gpu-operator-certified
  serverless:
    channel: stable
    source: redhat-operators
    package: serverless-operator
  servicemesh:
    channel: stable
    source: redhat-operators
    package: servicemeshoperator
  rhoai:
    channel: stable      # Knative/Serverless scenarios; override per scenario with rhoai_channel
    source: redhat-operators
    package: rhods-operator
  cert_manager:          # KServe standard (RawDeployment) dependency for RHOAI 3.x
    channel: stable-v1
    source: redhat-operators
    package: openshift-cert-manager-operator
  # ServeGuard supply-chain attestation (ADR-0001), selected by mode, never by default:
  rhtas:                 # keyless signing: Red Hat Trusted Artifact Signer 1.3.x
    channel: stable
    source: redhat-operators
    package: rhtas-operator
  kyverno:               # enforcer kyverno: Nirmata Enterprise for Kyverno (Red Hat Marketplace)
    channel: stable      # UNVERIFIED package/channel/source: the preflight checks them
    source: redhat-marketplace  # against the catalog and lists what is offered
    package: nirmata-kyverno-operator

infrastructure:
  gpu_instance_type: g6.xlarge
  # Supported GPU types for ROSA HCP (from Red Hat docs):
  #   g5.48xlarge, g6.xlarge-g6.48xlarge, g6e.xlarge-g6e.48xlarge
  #   p4d.24xlarge, p5.48xlarge
  compute_instance_type: m5.2xlarge
  # Minimum subnet tag headroom (50 - ~8 tags per pool)
  min_subnet_tag_headroom: 8

runtime:
  vllm_image: registry.redhat.io/rhaiis/vllm-cuda-rhel9:latest
  vllm_validated_image: registry.redhat.io/rhoai/odh-vllm-cuda-rhel9@sha256:46cffdeb70009f8f901e0dc658c8c499a5d2b4bbcea343741d7d7fda2a12b9b2

# ServeGuard OpenShift AI demo (scenarios/serveguard/*.yml).
# RHOAI 3.x with only KServe, standard (RawDeployment) mode.
serveguard:
  # Latest GA as of 2026-10-21. Switch to rhoai_next_channel once 3.6 is GA.
  # The stable-x.y naming pattern is from the RHOAI 3.5 install guide; the exact
  # names are checked against the cluster's PackageManifest before subscribing.
  rhoai_channel: stable-3.5
  rhoai_next_channel: stable-3.6
  # Red Hat AI Inference 3.5.0 images (Red Hat AI 3 supported configurations).
  vllm_cpu_image: registry.redhat.io/rhaii/vllm-cpu-rhel9:3.5.0     # x86_64, AVX2 minimum
  vllm_cuda_image: registry.redhat.io/rhaii/vllm-cuda-rhel9:3.5.0
  # Serving pool. The predictor requests 4 vCPU / 8 GiB (serveguard.openshift_ai
  # default; checked by the quota plan check), so the pool needs 8 vCPU:
  # m6i.2xlarge (CPU, AVX-512) or g6.2xlarge (1x L4).
  cpu_instance_type: m6i.2xlarge
  gpu_instance_type: g6.2xlarge
  # What the ServeGuard checks (roles/serveguard_checks) require.
  requirements:
    # OpenShift for RHOAI 3.5. The sources disagree: the 3.5 installation guide says
    # 4.19 to 4.20; the "Supported Configurations for 3.x" article says 4.19.9 to 4.22.
    #   guide   (default): what both support -> the latest 4.20.z ROSA HCP offers
    #   article (override, serveguard_openshift_range=article): up to 4.22.z
    # The ServeGuard playbooks pick the version from `rosa list versions --hosted-cp`;
    # cluster.openshift_version above stays the pin for the other scenarios.
    openshift:
      guide: { min: "4.19.9", max_exclusive: "4.21" }
      article: { min: "4.19.9", max_exclusive: "4.23" }
    # Minimum local CLI versions; null = must be present, any version.
    # (make, uv and the workload's own tools are checked by serveguard.openshift_ai.preflight.)
    cli: { rosa: "1.2.60", aws: "2.0.0", oc: "4.19.0", ansible_core: "2.15.0", ocm: null }
    python_modules: [kubernetes, jmespath]
    # Supply-chain attestation prerequisites (ADR-0001 §5.4)
    kyverno_min: "1.12.0"
    rhtas_minor: "1.3"
    rhtas_openshift: { min: "4.16.0", max_exclusive: "4.22" }   # RHTAS 1.3.6: OCP 4.16-4.21
    quay_min: "3.12.0"                                          # OCI 1.1 referrers (FEATURE_REFERRERS_API)
    cluster_image_policy_ga: "4.20.0"                           # ClusterImagePolicy GA (TP in 4.19)
    # EC2 vCPU quota codes per instance family (Running On-Demand instances).
    quota_codes:
      standard: L-1216C47A   # A, C, D, H, I, M, R, T, Z
      g_vt: L-DB2E81BA       # G and VT
      p: L-417A185B          # P

# OCM API schema — pin API versions, response schemas, and field paths.
# Bump api.*.version when migrating to a new OCM API version.
# Update fields.* when the response JSON structure changes.
ocm:
  api:
    clusters_mgmt:
      version: v1           # /api/clusters_mgmt/{version}/...
    accounts_mgmt:
      version: v1           # /api/accounts_mgmt/{version}/...
      # Field paths used in selectattr/map — the contract with OCM's JSON schema.
      # If a new API version renames or flattens these, update here only.
      fields:
        account_id: account.id     # path to account ID in a RoleBinding item
        role_id: role.id           # path to role ID in a RoleBinding item
  # Response 'kind' values we validate (schema contract)
  schema:
    role_binding_list: SubscriptionRoleBindingList
    role_binding: RoleBinding
    account: Account
    error: Error
  # Subscription-level roles required for cluster operations.
  # Keys are stable profile identifiers; values are OCM role IDs.
  subscription_roles:
    cluster_editor: ClusterEditor
    machine_pool_editor: MachinePoolEditor
  # Cluster groups
  groups:
    cluster_admins:
      name: cluster-admins   # OCM group name in the groups API path
      user_id_field: id       # field path for user ID in group members response

# GPU capabilities by AWS instance type
gpu_capabilities:
  # L4 (Ada Lovelace) — 24GB VRAM, no native FP8 compute
  g6.xlarge:    { gpu: L4,   vram_gb: 24, fp8_compute: false, gpus_per_node: 1 }
  g6.2xlarge:   { gpu: L4,   vram_gb: 24, fp8_compute: false, gpus_per_node: 1 }
  g6.4xlarge:   { gpu: L4,   vram_gb: 24, fp8_compute: false, gpus_per_node: 1 }
  g6.12xlarge:  { gpu: L4,   vram_gb: 24, fp8_compute: false, gpus_per_node: 4 }
  # L40S (Ada Lovelace) — 48GB VRAM, FP8 tensor cores
  g6e.xlarge:   { gpu: L40S, vram_gb: 48, fp8_compute: true,  gpus_per_node: 1 }
  g6e.2xlarge:  { gpu: L40S, vram_gb: 48, fp8_compute: true,  gpus_per_node: 1 }
  g6e.4xlarge:  { gpu: L40S, vram_gb: 48, fp8_compute: true,  gpus_per_node: 1 }
  g6e.12xlarge: { gpu: L40S, vram_gb: 48, fp8_compute: true,  gpus_per_node: 4 }
  # A100 (Ampere) — 40/80GB VRAM, no FP8 tensor cores
  p4d.24xlarge: { gpu: A100, vram_gb: 40, fp8_compute: false, gpus_per_node: 8 }
  # H100 (Hopper) — 80GB VRAM, full FP8 support
  p5.48xlarge:  { gpu: H100, vram_gb: 80, fp8_compute: true,  gpus_per_node: 8 }
