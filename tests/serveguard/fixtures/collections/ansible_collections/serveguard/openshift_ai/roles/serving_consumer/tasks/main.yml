---
- name: "stub serving_consumer: record the call"
  ansible.builtin.set_fact:
    stub_calls: "{{ (stub_calls | default([])) + ['serving_consumer'] }}"

- name: "stub serving_consumer: record the predictor size it was given"
  ansible.builtin.set_fact:
    stub_seen_predictor: { cpu: "{{ serveguard_predictor_cpu }}", memory: "{{ serveguard_predictor_memory }}" }

- name: "stub serving_consumer: publish the serving result"
  ansible.builtin.set_fact:
    serveguard_serving_result:
      inference_service: serveguard-demo/serveguard-demo
      ready: "{{ stub_serving_ready }}"
      guard_exit_code: "{{ stub_guard_exit }}"
      annotations:
        serveguard.io/admitted: "true"
        serveguard.io/adapter-digest: 28266fff00
        serveguard.io/package-root: 17a154dc00
        serveguard.io/base-hash: ecf2f3e100
