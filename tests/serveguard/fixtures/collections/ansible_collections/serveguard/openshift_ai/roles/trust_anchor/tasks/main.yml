---
- name: "stub trust_anchor main: record the call"
  ansible.builtin.set_fact:
    stub_calls: "{{ (stub_calls | default([])) + ['trust_anchor'] }}"

# Like roles/common's render: the operator-signed anchor, the receiver it requires
# (stub_receiver_required) and the stories this render runs (+4 receiver stories).
- name: "stub trust_anchor: the rendered anchor"
  ansible.builtin.set_fact:
    serveguard_rendered:
      anchor_digest: "{{ stub_anchor_digest | default('a' * 64) }}"
      anchor_signed: "{{ stub_anchor_signed | default(true) }}"
      receiver: >-
        {{ stub_rendered_receiver | default(
             {'required': true, 'detector_digest': stub_detector | default('4' * 64), 'tau': 0.05, 'max_bound': '3/2'}
             if (stub_receiver_required | default(false) | bool) else {'required': false}) }}
      stories: >-
        {{ ['query', 'unadmitted-isvc', 'tamper-read-factor', 'restore']
           + (['receiver-admitted', 'receiver-tampered-witness', 'receiver-tau-looser', 'receiver-missing']
              if (stub_receiver_required | default(false) | bool) else []) }}
  when: stub_supply_chain | default(false) | bool
