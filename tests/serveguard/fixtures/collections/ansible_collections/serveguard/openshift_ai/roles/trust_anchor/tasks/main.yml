---
- name: "stub trust_anchor main: record the call"
  ansible.builtin.set_fact:
    stub_calls: "{{ (stub_calls | default([])) + ['trust_anchor'] }}"

- name: "stub trust_anchor: the rendered, operator-signed anchor (like roles/common)"
  ansible.builtin.set_fact:
    serveguard_rendered: { anchor_digest: "{{ stub_anchor_digest | default('a' * 64) }}", anchor_signed: "{{ stub_anchor_signed | default(true) }}" }
  when: stub_supply_chain | default(false) | bool
