---
- name: "stub public_verifier admit: record the call"
  ansible.builtin.set_fact:
    stub_calls: "{{ (stub_calls | default([])) + ['public_verifier:admit'] }}"

- name: "stub public_verifier admit: supply-chain fact (ADR-0001)"
  ansible.builtin.set_fact:
    serveguard_vsa: "{{ stub_vsa | default({'adapter_ref': serveguard_adapter_ref, 'admitted': true, 'reason': 'admitted'}) }}"
  when: stub_supply_chain | default(false) | bool
