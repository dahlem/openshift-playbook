---
# Offline: the full preflight sequence (roles/serveguard_checks/tasks/preflight.yml,
# what playbooks/serveguard-demo-preflight.yml runs) over whole-account fixture
# worlds, checking the decisions it hands to the deploy steps and the table.
- name: ServeGuard preflight sequence (offline, fixture worlds)
  hosts: localhost
  gather_facts: false
  vars:
    serveguard_checks_mode: report
    rosa_cluster_name: serveguard
    aws_region: us-east-1
    rosa_oidc_config_id: oidc-123
    rosa_private_subnet: subnet-priv
    rosa_public_subnet: subnet-pub
    rosa_installer_role: arn:aws:iam::1:role/I
    rosa_support_role: arn:aws:iam::1:role/S
    rosa_worker_role: arn:aws:iam::1:role/W
    serveguard_pool_name: sg-cpu
    serveguard_pool_instance_type: m6i.2xlarge
    operators_enabled: [cert_manager, rhoai]
    rhoai_channel: stable-3.5
    ai_platform_mode: standard
    serveguard_accelerator: cpu
    serveguard_openshift_range: guide
  tasks:
    - name: Load version constraints
      ansible.builtin.include_vars: { file: "{{ versions_file }}", name: versions }

    - name: Load fixtures
      ansible.builtin.set_fact:
        fx: "{{ fx | default({}) | combine({(item | basename | splitext | first): lookup('file', item) | from_json}) }}"
      loop: "{{ query('fileglob', playbook_dir ~ '/fixtures/*.json') }}"
      loop_control:
        label: "{{ item | basename }}"

    - name: Load worlds
      ansible.builtin.include_vars: { file: worlds.yml }

    # ---- empty account: everything is TODO/N-A, nothing blocks
    - name: Preflight an empty account
      ansible.builtin.include_role: { name: serveguard_checks, tasks_from: preflight }
      vars:
        serveguard_checks_fixtures: "{{ worlds.empty_account }}"

    - name: Empty account - table
      ansible.builtin.include_role: { name: serveguard_checks, tasks_from: report }

    - name: Empty account - decisions
      ansible.builtin.assert:
        that:
          - _sg_blocking | length == 0
          - _sg_cluster.action == 'create'
          - _sg_versions.version == '4.20.12'
          - _sg_checks | selectattr('step', 'equalto', 'cluster') | map(attribute='detail') | first is search('OpenShift 4.20.12')
          - _sg_pool.action == 'create'
          - _sg_operators.subset == ['cert_manager', 'rhoai']
          - _sg_kyverno.action == 'none' and _sg_rhtas.action == 'none'
          - _sg_platform.action == 'create'
          - _sg_checks | selectattr('status', 'equalto', 'n/a') | list | length >= 5
          - _sg_checks | selectattr('check', 'equalto', 'vCPU quota Standard (A,C,D,H,I,M,R,T,Z)') | map(attribute='detail') | first is search('this run adds 24')
        fail_msg: "{{ _sg_checks | map('serveguard_row') | list }}"

    - name: Reset the table
      ansible.builtin.set_fact:
        _sg_checks: []

    # ---- keyless + kyverno on an empty account: RHTAS and Kyverno join the operators
    - name: Preflight an empty account in keyless + kyverno mode
      ansible.builtin.include_role: { name: serveguard_checks, tasks_from: preflight }
      vars:
        serveguard_checks_fixtures: "{{ worlds.empty_account_keyless_kyverno }}"

    - name: Keyless + kyverno - decisions
      ansible.builtin.assert:
        that:
          - _sg_blocking | length == 0
          - _sg_workload.signing_mode == 'keyless' and _sg_workload.enforcer == 'kyverno'
          - _sg_operators.subset == ['cert_manager', 'rhoai', 'rhtas', 'kyverno']
          - _sg_kyverno.action == 'install'
          - _sg_rhtas.action == 'create'
          - _sg_checks | selectattr('check', 'equalto', 'RHTAS on OpenShift') | map(attribute='status') | list == ['ok']
        fail_msg: "{{ _sg_checks | map('serveguard_row') | list }}"

    - name: Reset the table
      ansible.builtin.set_fact:
        _sg_checks: []

    # ---- everything already in place: every step reports SATISFIED, nothing would run
    - name: Preflight a finished deployment
      ansible.builtin.include_role: { name: serveguard_checks, tasks_from: preflight }
      vars:
        serveguard_checks_fixtures: "{{ worlds.all_satisfied }}"

    - name: Finished deployment - table
      ansible.builtin.include_role: { name: serveguard_checks, tasks_from: report }

    - name: Finished deployment - every step is skipped
      ansible.builtin.assert:
        that:
          - _sg_blocking | length == 0
          - _sg_cluster.action == 'satisfied'
          - _sg_pool.action == 'satisfied'
          - _sg_operators.action == 'satisfied' and _sg_operators.subset == []
          - _sg_platform.action == 'satisfied'
          - _sg_checks | selectattr('status', 'equalto', 'satisfied') | list | length == 5
          - _sg_checks | selectattr('status', 'equalto', 'todo') | list | length == 0
          - _sg_workload.predictor_cpu == '4'
        fail_msg: "{{ _sg_checks | map('serveguard_row') | list }}"

    - name: Reset the table
      ansible.builtin.set_fact:
        _sg_checks: []

    # ---- a Mistral/Knative cluster: report every conflict, then fail
    - name: Preflight a cluster with a Knative RHOAI install
      block:
        - name: Run the preflight
          ansible.builtin.include_role: { name: serveguard_checks, tasks_from: preflight }
          vars:
            serveguard_checks_fixtures: "{{ worlds.mistral_cluster }}"
        - name: Print the table (fails on blocking rows)
          ansible.builtin.include_role: { name: serveguard_checks, tasks_from: report }
        - name: Not reached
          ansible.builtin.fail:
            msg: "preflight did not fail on conflicts"
      rescue:
        - name: Conflicting cluster - all conflicts reported, in one table
          ansible.builtin.assert:
            that:
              - "'blocking check(s)' in ansible_failed_result.msg"
              # capacity is N/A, not FAIL: the serving pool that would hold the predictor is still TODO
              - _blocked | sort == ['cluster/version', 'operator rhoai/Subscription', 'platform/DataScienceCluster'] | sort
              - _sg_checks | selectattr('step', 'equalto', 'capacity') | selectattr('status', 'equalto', 'n/a') | map(attribute='check') | sort == ['predictor (+guard init)', 'predictor + story Job', 'publisher prove Job', 'verifier approve Job']
            fail_msg: "{{ _blocked }}"
          vars:
            _blocked: >-
              {{ _sg_checks | selectattr('status', 'in', ['fail', 'conflict'])
                 | map(attribute='step') | zip(_sg_checks | selectattr('status', 'in', ['fail', 'conflict']) | map(attribute='check'))
                 | map('join', '/') | list }}

    # ---- re-run with a required receiver over an anchor pinned without one
    - name: Reset the table
      ansible.builtin.set_fact:
        _sg_checks: []

    - name: Preflight a receiver switch
      block:
        - name: Run the preflight
          ansible.builtin.include_role: { name: serveguard_checks, tasks_from: preflight }
          vars:
            serveguard_checks_fixtures: "{{ worlds.receiver_switch }}"
        - name: Print the table (fails on blocking rows)
          ansible.builtin.include_role: { name: serveguard_checks, tasks_from: report }
        - name: Not reached
          ansible.builtin.fail:
            msg: "preflight did not fail on the anchor change"
      rescue:
        - name: Receiver switch - only the anchor change blocks
          ansible.builtin.assert:
            that:
              - _blocked == ['receiver/trust anchor']
              - _sg_receiver.detector_digest == fx['receiver-smollm2'].detector_digest
            fail_msg: "{{ _blocked }}"
          vars:
            _blocked: >-
              {{ _sg_checks | selectattr('status', 'in', ['fail', 'conflict'])
                 | map(attribute='step') | zip(_sg_checks | selectattr('status', 'in', ['fail', 'conflict']) | map(attribute='check'))
                 | map('join', '/') | list }}
