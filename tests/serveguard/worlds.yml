---
# Whole-account states for test_preflight.yml: what every gather step would read.
_local_ok:
  ansible_core: "2.20.3"
  tools:
    rosa: { rc: 0, out: "1.2.62" }
    aws: { rc: 0, out: "aws-cli/2.31.8" }
    oc: { rc: 0, out: "Client Version: 4.20.0" }
    ocm: { rc: 0, out: "1.0.10" }
  python_modules: { kubernetes: true, jmespath: true }
_aws_ok:
  identity: "{{ fx['aws-identity'] }}"
  rosa_logged_in: true
  oidc_configs: "{{ fx['rosa-oidc'] }}"
  roles: { installer: { arn: "arn:aws:iam::1:role/I", exists: true }, support: { arn: "arn:aws:iam::1:role/S", exists: true },
           worker: { arn: "arn:aws:iam::1:role/W", exists: true } }
  elb_role: true
  subnets: "{{ fx['aws-subnets'] }}"
  tag_count: 12
_quota_ok:
  az: us-east-1a
  offered: [m5.2xlarge, m6i.2xlarge]
  rosa_types: [m5.2xlarge, m6i.2xlarge]
  specs: "{{ fx['aws-specs'] }}"
  quotas: { L-1216C47A: 64.0, L-DB2E81BA: 0.0, L-417A185B: 0.0 }
  instances: []
_unreachable_op: { cluster_reachable: false }
_srs_ok: { path: /home/demo/.ezkl/srs/kzg19.srs, exists: true, sha256: d1a1655b4366a766d1578beb257849a92bf91cb1358c1a2c37ab180c5d3a204d }
_receiver_none: { path: "", exists: false, descriptor: null, parse_error: "", cluster_reachable: false, anchor: null }
_receiver_none_reachable: { path: "", exists: false, descriptor: null, parse_error: "", cluster_reachable: true, anchor: null }
_versions_list: "{{ fx['rosa-versions'] }}"
_workload_stub:
  collection: { name: serveguard.openshift_ai, version: 0.0.0-stub, path: /stub/serveguard/openshift_ai }
  defaults:
    serveguard_predictor_cpu: "4"
    serveguard_predictor_memory: 8Gi
    serveguard_guard_cpu: 500m
    serveguard_guard_memory: 1Gi
    serveguard_receiver_build_cpu: "2"
    serveguard_receiver_build_memory: 4Gi
    serveguard_job_cpu: 500m
    serveguard_job_memory: 1Gi
    serveguard_approve_cpu: "4"
    serveguard_approve_memory: 16Gi
    serveguard_publish_cpu: "4"
    serveguard_publish_memory: 16Gi
    serveguard_admit_cpu: "2"
    serveguard_admit_memory: 4Gi
    serveguard_work_size: 16Gi
    serveguard_publisher_namespace: sg-publisher
    serveguard_verifier_namespace: sg-verifier
    serveguard_logrows: 19
    serveguard_signing_mode: keypair
    serveguard_signing_keys_dir: /home/demo/.cache/serveguard-openshift-ai/keys
    serveguard_enforcer: vap
    serveguard_registry: image-registry.openshift-image-registry.svc:5000
    serveguard_attestation_namespace: sg-attestations
    serveguard_rhtas_namespace: trusted-artifact-signer
    serveguard_rhtas_trust_config: ""
    serveguard_rhtas_oidc_issuer: ""
    serveguard_fulcio_audience: sigstore
    serveguard_attestation_uri_base: https://github.com/dahlem/serveguard/attestation
    serveguard_srs_path: /home/demo/.ezkl/srs/kzg19.srs
    serveguard_srs_sha256: d1a1655b4366a766d1578beb257849a92bf91cb1358c1a2c37ab180c5d3a204d
    serveguard_max_write_norm: 4.0
    serveguard_max_typed_gain: 16.0
    serveguard_receiver_required: false
    serveguard_receiver_descriptor: ""
    serveguard_overrides: {}
    serveguard_kyverno_namespace: kyverno
    serveguard_namespace: serveguard-demo
    serveguard_image: ""
    serveguard_storage_class: ""
    serveguard_store_access_mode: ReadWriteOnce
  overrides: {}
_ready_pod:
  metadata: { name: serveguard-demo-predictor-abc, namespace: serveguard-demo }
  spec: { nodeName: ip-10-0-1-3, containers: [{ name: c, resources: { requests: { cpu: "4", memory: 8Gi } } }] }
  status: { phase: Running }

_workload_keyless_kyverno: >-
  {{ _workload_stub | combine({'overrides': {'serveguard_signing_mode': 'keyless', 'serveguard_enforcer': 'kyverno'}}) }}

_workload_receiver: >-
  {{ _workload_stub | combine({'overrides': {'serveguard_receiver_required': true,
                                             'serveguard_receiver_descriptor': 'evidence/receiver-smollm2.json'}}) }}

worlds:
  empty_account: &empty_account
    local: "{{ _local_ok }}"
    srs: "{{ _srs_ok }}"
    receiver: "{{ _receiver_none }}"
    signing: { keys: {} }
    image_policy: { existing: null, key_exists: false, key_data: "" }
    aws: "{{ _aws_ok }}"
    cluster: { exists: false, cluster: {} }
    versions: { cluster_exists: false, versions: "{{ _versions_list }}" }
    cluster_reachable: false
    pool: { cluster_exists: false, exists: false, pool: {}, nodes: [] }
    quota: "{{ _quota_ok }}"
    operators: ["{{ _unreachable_op }}", "{{ _unreachable_op }}"]
    platform: { cluster_reachable: false }
    kyverno: { cluster_reachable: false }
    rhtas: { cluster_reachable: false }
    registry: { cluster_reachable: false }
    storage: { cluster_reachable: false }
    capacity: { cluster_reachable: false }
    workload: "{{ _workload_stub }}"

  all_satisfied: &all_satisfied
    local: "{{ _local_ok }}"
    srs: "{{ _srs_ok }}"
    receiver: "{{ _receiver_none }}"
    signing: { keys: { operator: [k/operator.key, k/operator.pub], publisher: [k/publisher.key, k/publisher.pub], verifier: [k/verifier.key, k/verifier.pub] } }
    image_policy: { existing: null, key_exists: false, key_data: "" }
    aws: "{{ _aws_ok }}"
    cluster: { exists: true, cluster: "{{ fx['rosa-cluster-ready'] }}" }
    versions: { cluster_exists: true, versions: "{{ _versions_list }}" }
    cluster_reachable: true
    pool: { cluster_exists: true, exists: true, pool: "{{ fx['rosa-pool-cpu'] }}", nodes: "{{ fx['nodes-cpu'][2:] }}" }
    quota: "{{ _quota_ok }}"
    operators:
      - { cluster_reachable: true, package: "{{ fx['pkg-certmgr'] }}",
          operator_groups: ["{{ fx['og-rhods-ours'] | combine({'metadata': {'name': 'cert-manager-operator', 'namespace': 'cert-manager-operator'}}) }}"],
          subscription: "{{ fx['sub-certmgr'] }}", other_subscriptions: [], csv: "{{ fx['csv-succeeded'] }}" }
      - { cluster_reachable: true, package: "{{ fx['pkg-rhods'] }}", operator_groups: ["{{ fx['og-rhods-ours'] }}"],
          subscription: "{{ fx['sub-rhods-35'] }}", other_subscriptions: [], csv: "{{ fx['csv-succeeded'] }}" }
    kyverno: { cluster_reachable: true, crd: false, subscription: null, deployments: [] }
    rhtas: { cluster_reachable: true, crd: false, securesigns: [], components: {}, issuer: "" }
    platform: { cluster_reachable: true, dsc_crd: true, dscs: ["{{ fx['dsc-ready'] }}"], dscis: ["{{ fx['dsci-default'] }}"], kserve: "{{ fx['kserve-ready'] }}" }
    registry: { cluster_reachable: true, config: "{{ fx['registry-managed'] }}", deployment: "{{ fx['registry-deploy'] }}" }
    storage: { cluster_reachable: true, storage_classes: "{{ fx['sc-gp3-default'] }}" }
    capacity: { cluster_reachable: true, nodes: "{{ fx['nodes-cpu'] }}", pods: ["{{ _ready_pod }}"] }
    workload: "{{ _workload_stub }}"

  mistral_cluster:   # an existing Knative/Mistral install on an old cluster
    local: "{{ _local_ok }}"
    srs: "{{ _srs_ok }}"
    receiver: "{{ _receiver_none }}"
    signing: { keys: {} }
    image_policy: { existing: null, key_exists: false, key_data: "" }
    aws: "{{ _aws_ok }}"
    cluster: { exists: true, cluster: "{{ fx['rosa-cluster-old'] }}" }
    versions: { cluster_exists: true, versions: "{{ _versions_list }}" }
    cluster_reachable: true
    pool: { cluster_exists: true, exists: false, pool: {}, nodes: [] }
    quota: "{{ _quota_ok }}"
    operators:
      - { cluster_reachable: true, package: "{{ fx['pkg-certmgr'] }}", operator_groups: [], subscription: null, other_subscriptions: [], csv: null }
      - { cluster_reachable: true, package: "{{ fx['pkg-rhods'] }}", operator_groups: ["{{ fx['og-rhods-ours'] }}"],
          subscription: "{{ fx['sub-rhods-stable'] }}", other_subscriptions: [], csv: "{{ fx['csv-succeeded'] }}" }
    kyverno: { cluster_reachable: true, crd: false, subscription: null, deployments: [] }
    rhtas: { cluster_reachable: true, crd: false, securesigns: [], components: {}, issuer: "" }
    platform: { cluster_reachable: true, dsc_crd: true, dscs: ["{{ fx['dsc-full'] }}"], dscis: ["{{ fx['dsci-default'] }}"], kserve: "{{ fx['kserve-ready'] }}" }
    registry: { cluster_reachable: true, config: "{{ fx['registry-managed'] }}", deployment: "{{ fx['registry-deploy'] }}" }
    storage: { cluster_reachable: true, storage_classes: "{{ fx['sc-gp3-default'] }}" }
    capacity: { cluster_reachable: true, nodes: "{{ fx['nodes-small'] }}", pods: [] }
    workload: "{{ _workload_stub }}"

  empty_account_keyless_kyverno:
    <<: *empty_account
    workload: "{{ _workload_keyless_kyverno }}"
    operators: ["{{ _unreachable_op }}", "{{ _unreachable_op }}", "{{ _unreachable_op }}", "{{ _unreachable_op }}"]

  # A finished keypair deployment re-run with a required receiver: the pinned anchor has none.
  receiver_switch:
    <<: *all_satisfied
    workload: "{{ _workload_receiver }}"
    receiver:
      path: evidence/receiver-smollm2.json
      exists: true
      parse_error: ""
      cluster_reachable: true
      descriptor: "{{ fx['receiver-smollm2'] }}"
      anchor: { schema: serveguard-openshift-ai.trust-anchor.v1, base_hash: ecf2f3e1 }
