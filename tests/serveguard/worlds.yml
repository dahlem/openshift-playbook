---
# Whole-account states for test_preflight.yml: what every gather step would read.
_local_ok:
  ansible_core: "2.20.3"
  tools:
    rosa: { rc: 0, out: "1.2.62" }
    aws: { rc: 0, out: "aws-cli/2.31.8" }
    oc: { rc: 0, out: "Client Version: 4.20.0" }
    ocm: { rc: 0, out: "1.0.10" }
  python_modules: { kubernetes: true, jmespath: true }
_aws_ok:
  identity: "{{ fx['aws-identity'] }}"
  rosa_logged_in: true
  oidc_configs: "{{ fx['rosa-oidc'] }}"
  roles: { installer: { arn: "arn:aws:iam::1:role/I", exists: true }, support: { arn: "arn:aws:iam::1:role/S", exists: true },
           worker: { arn: "arn:aws:iam::1:role/W", exists: true } }
  elb_role: true
  subnets: "{{ fx['aws-subnets'] }}"
  tag_count: 12
_quota_ok:
  az: us-east-1a
  offered: [m5.2xlarge, m6i.2xlarge]
  rosa_types: [m5.2xlarge, m6i.2xlarge]
  specs: "{{ fx['aws-specs'] }}"
  quotas: { L-1216C47A: 64.0, L-DB2E81BA: 0.0, L-417A185B: 0.0 }
  instances: []
_unreachable_op: { cluster_reachable: false }
_workload_stub:
  collection: { name: serveguard.openshift_ai, version: 0.0.0-stub, path: /stub/serveguard/openshift_ai }
  defaults:
    serveguard_predictor_cpu: "4"
    serveguard_predictor_memory: 8Gi
    serveguard_guard_resources: { cpu: 500m, memory: 1Gi }
    serveguard_build_resources: { cpu: "2", memory: 4Gi }
    serveguard_job_resources: { cpu: 500m, memory: 1Gi }
    serveguard_namespace: serveguard-demo
    serveguard_image: ""
    serveguard_storage_class: ""
    serveguard_store_access_mode: ReadWriteOnce
  overrides: {}
_ready_pod:
  metadata: { name: serveguard-demo-predictor-abc, namespace: serveguard-demo }
  spec: { nodeName: ip-10-0-1-3, containers: [{ name: c, resources: { requests: { cpu: "4", memory: 8Gi } } }] }
  status: { phase: Running }

worlds:
  empty_account:
    local: "{{ _local_ok }}"
    aws: "{{ _aws_ok }}"
    cluster: { exists: false, cluster: {} }
    cluster_reachable: false
    pool: { cluster_exists: false, exists: false, pool: {}, nodes: [] }
    quota: "{{ _quota_ok }}"
    operators: ["{{ _unreachable_op }}", "{{ _unreachable_op }}"]
    platform: { cluster_reachable: false }
    registry: { cluster_reachable: false }
    storage: { cluster_reachable: false }
    capacity: { cluster_reachable: false }
    workload: "{{ _workload_stub }}"

  all_satisfied:
    local: "{{ _local_ok }}"
    aws: "{{ _aws_ok }}"
    cluster: { exists: true, cluster: "{{ fx['rosa-cluster-ready'] }}" }
    cluster_reachable: true
    pool: { cluster_exists: true, exists: true, pool: "{{ fx['rosa-pool-cpu'] }}", nodes: "{{ fx['nodes-cpu'][2:] }}" }
    quota: "{{ _quota_ok }}"
    operators:
      - { cluster_reachable: true, package: "{{ fx['pkg-certmgr'] }}",
          operator_groups: ["{{ fx['og-rhods-ours'] | combine({'metadata': {'name': 'cert-manager-operator', 'namespace': 'cert-manager-operator'}}) }}"],
          subscription: "{{ fx['sub-certmgr'] }}", other_subscriptions: [], csv: "{{ fx['csv-succeeded'] }}" }
      - { cluster_reachable: true, package: "{{ fx['pkg-rhods'] }}", operator_groups: ["{{ fx['og-rhods-ours'] }}"],
          subscription: "{{ fx['sub-rhods-35'] }}", other_subscriptions: [], csv: "{{ fx['csv-succeeded'] }}" }
    platform: { cluster_reachable: true, dsc_crd: true, dscs: ["{{ fx['dsc-ready'] }}"], dscis: ["{{ fx['dsci-default'] }}"], kserve: "{{ fx['kserve-ready'] }}" }
    registry: { cluster_reachable: true, config: "{{ fx['registry-managed'] }}", deployment: "{{ fx['registry-deploy'] }}" }
    storage: { cluster_reachable: true, storage_classes: "{{ fx['sc-gp3-default'] }}" }
    capacity: { cluster_reachable: true, nodes: "{{ fx['nodes-cpu'] }}", pods: ["{{ _ready_pod }}"] }
    workload: "{{ _workload_stub }}"

  mistral_cluster:   # an existing Knative/Mistral install on an old cluster
    local: "{{ _local_ok }}"
    aws: "{{ _aws_ok }}"
    cluster: { exists: true, cluster: "{{ fx['rosa-cluster-old'] }}" }
    cluster_reachable: true
    pool: { cluster_exists: true, exists: false, pool: {}, nodes: [] }
    quota: "{{ _quota_ok }}"
    operators:
      - { cluster_reachable: true, package: "{{ fx['pkg-certmgr'] }}", operator_groups: [], subscription: null, other_subscriptions: [], csv: null }
      - { cluster_reachable: true, package: "{{ fx['pkg-rhods'] }}", operator_groups: ["{{ fx['og-rhods-ours'] }}"],
          subscription: "{{ fx['sub-rhods-stable'] }}", other_subscriptions: [], csv: "{{ fx['csv-succeeded'] }}" }
    platform: { cluster_reachable: true, dsc_crd: true, dscs: ["{{ fx['dsc-full'] }}"], dscis: ["{{ fx['dsci-default'] }}"], kserve: "{{ fx['kserve-ready'] }}" }
    registry: { cluster_reachable: true, config: "{{ fx['registry-managed'] }}", deployment: "{{ fx['registry-deploy'] }}" }
    storage: { cluster_reachable: true, storage_classes: "{{ fx['sc-gp3-default'] }}" }
    capacity: { cluster_reachable: true, nodes: "{{ fx['nodes-small'] }}", pods: [] }
    workload: "{{ _workload_stub }}"
