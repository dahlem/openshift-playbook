---
# Offline: run every decision case in cases.yml through the real
# _evaluate_<step>.yml tasks and the serveguard_checks filters.
#
#   tests/serveguard/run.sh
- name: ServeGuard check decisions (offline, fixtures)
  hosts: localhost
  gather_facts: false
  vars:
    serveguard_checks_mode: report
    rosa_cluster_name: serveguard
    aws_region: us-east-1
    rosa_oidc_config_id: oidc-123
    rosa_private_subnet: subnet-priv
    rosa_public_subnet: subnet-pub
    serveguard_pool_name: sg-cpu
    serveguard_pool_instance_type: m6i.2xlarge
    operators_enabled: [cert_manager, rhoai]
    rhoai_channel: stable-3.5
    ai_platform_mode: standard
    serveguard_openshift_range: guide
    # Effective workload requests as pre_workload would produce them. These are test
    # inputs; test_interface.yml checks that pre_workload reads the real collection.
    _test_workload:
      predictor_cpu: "4"
      predictor_memory: 8Gi
      guard_cpu: 500m
      guard_memory: 1Gi
      job_cpu: 500m
      job_memory: 1Gi
      build_cpu: "2"
      build_memory: 4Gi
      approve_cpu: "4"
      approve_memory: 16Gi
      publish_cpu: "4"
      publish_memory: 16Gi
      admit_cpu: "2"
      admit_memory: 4Gi
      work_size: 16Gi
      namespace: serveguard-demo
      publisher_namespace: sg-publisher
      verifier_namespace: sg-verifier
      receiver_image: ""
      storage_class: ""
      store_access_mode: ReadWriteOnce
      logrows: 19
      supply_chain: true
      signing_mode: keypair
      signing_keys_dir: /home/demo/.cache/serveguard-openshift-ai/keys
      enforcer: vap
      registry: image-registry.openshift-image-registry.svc:5000
      attestation_namespace: sg-attestations
      rhtas_namespace: trusted-artifact-signer
      rhtas_trust_config: ""
      rhtas_oidc_issuer: ""
      fulcio_audience: sigstore
      attestation_uri_base: https://attest.example.org/serveguard
      kyverno_namespace: kyverno
    # Variables a case may override; reset to these before each case.
    _test_defaults:
      serveguard_openshift_range: guide
      serveguard_srs_sha256: ""
      serveguard_allow_existing_kyverno: false
      serveguard_allow_securesign_update: false
      serveguard_cluster_image_policy: false
      serveguard_receiver_image_public_key: ""
      serveguard_allow_cip_tech_preview: false
      serveguard_quay: {}
      serveguard_allow_cluster_version: false
      serveguard_allow_pool_mismatch: false
      serveguard_allow_channel_change: false
      serveguard_allow_dsc_update: false
      serveguard_cluster_must_exist: false
      serveguard_redeploy: false
      serveguard_accelerator: cpu
      serveguard_pool_instance_type: m6i.2xlarge
  tasks:
    - name: Load version constraints
      ansible.builtin.include_vars:
        file: "{{ versions_file }}"
        name: versions

    - name: Load fixtures
      ansible.builtin.set_fact:
        fx: "{{ fx | default({}) | combine({(item | basename | splitext | first): lookup('file', item) | from_json}) }}"
      loop: "{{ query('fileglob', playbook_dir ~ '/fixtures/*.json') }}"
      loop_control:
        label: "{{ item | basename }}"

    - name: Load cases
      ansible.builtin.include_vars:
        file: cases.yml

    - name: Run cases
      ansible.builtin.include_tasks: _case.yml
      loop: "{{ cases }}"
      loop_control:
        loop_var: case
        label: "{{ case.step }}: {{ case.name }}"

    - name: Result
      ansible.builtin.debug:
        msg: "{{ cases | length }} decision cases passed."
