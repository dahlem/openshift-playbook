---
# Decision cases for roles/serveguard_checks, run offline on fixture JSON by
# test_checks.yml. Each case sets _sg_raw_<step> (what the gather tasks would
# have read), optional extra facts/vars, runs _evaluate_<step>.yml and checks:
#   action   the decision (_sg_result.action)
#   status   {check: status} for the rows named
#   blocking whether any row is fail/conflict (the step would stop)
#   detail   substrings that must appear in some row's detail
# `workload` overrides entries of _sg_workload, which otherwise holds what
# pre_workload read from the stub collection's role defaults.
cases:
  # ---- workload requests (serveguard.openshift_ai role defaults) ----------------------
  - name: collection defaults are the requests
    step: workload
    raw:
      collection: { name: serveguard.openshift_ai, version: "0.1.0", path: /c/serveguard/openshift_ai }
      defaults: { serveguard_predictor_cpu: "4", serveguard_predictor_memory: 8Gi, serveguard_job_cpu: 500m, serveguard_job_memory: 1Gi,
                  serveguard_publish_cpu: "4", serveguard_publish_memory: 16Gi, serveguard_approve_cpu: "4", serveguard_approve_memory: 16Gi }
      overrides: {}
    expect: { blocking: false, status: { serveguard_predictor_cpu: ok, serveguard_receiver_build_cpu: warn }, detail: ["4 (collection default)"] }

  - name: a scenario override wins and is reported as passed through
    step: workload
    raw:
      collection: { name: serveguard.openshift_ai, version: "0.1.0", path: /c/serveguard/openshift_ai }
      defaults: { serveguard_predictor_cpu: "4", serveguard_predictor_memory: 8Gi, serveguard_publish_cpu: "4", serveguard_publish_memory: 16Gi,
                  serveguard_approve_cpu: "4", serveguard_approve_memory: 16Gi }
      overrides: { serveguard_predictor_cpu: "6" }
    expect: { blocking: false, detail: ["6 (override; passed to the collection)"] }

  - name: collection not installed -> fail with the install command
    step: workload
    raw: { collection: null, defaults: {}, overrides: {} }
    expect: { blocking: true, status: { serveguard.openshift_ai: fail }, detail: ["requirements-dev.yml"] }

  - name: collection without the predictor defaults -> fail
    step: workload
    raw:
      collection: { name: serveguard.openshift_ai, version: "0.0.1", path: /c/serveguard/openshift_ai }
      defaults: {}
      overrides: {}
    expect: { blocking: true, status: { serveguard_predictor_cpu: fail, serveguard_predictor_memory: fail, serveguard_publish_memory: fail } }

  # ---- local tools -------------------------------------------------------------------
  - name: local tools present and new enough
    step: local
    raw:
      ansible_core: "2.20.3"
      tools:
        rosa: { rc: 0, out: "1.2.62\nYour ROSA CLI is up to date." }
        aws: { rc: 0, out: "aws-cli/2.31.8 Python/3.13.7 Darwin/25.6.0" }
        oc: { rc: 0, out: "Client Version: 4.20.0\nKustomize Version: v5.6.0" }
        ocm: { rc: 0, out: "1.0.10" }
      python_modules: { kubernetes: true, jmespath: true }
    expect: { blocking: false, status: { rosa: ok, oc: ok, ansible_core: ok } }

  - name: old oc, old ansible-core and missing ocm block
    step: local
    raw:
      ansible_core: "2.14.1"
      tools:
        rosa: { rc: 0, out: "1.2.62" }
        aws: { rc: 0, out: "aws-cli/2.31.8" }
        oc: { rc: 0, out: "Client Version: 4.16.3" }
        ocm: { rc: 127, out: "sh: ocm: command not found" }
      python_modules: { kubernetes: false, jmespath: true }
    expect:
      blocking: true
      status: { oc: fail, ocm: fail, ansible_core: fail, "python: kubernetes": fail, rosa: ok }
      detail: ["4.16.3 < required 4.19.0", "pip install kubernetes"]

  # ---- AWS account (bootstrap postcondition) --------------------------------------------
  - name: account ready
    step: aws
    raw:
      identity: "{{ fx['aws-identity'] }}"
      rosa_logged_in: true
      oidc_configs: "{{ fx['rosa-oidc'] }}"
      roles: { installer: { arn: "arn:aws:iam::1:role/HCP-ROSA-Installer-Role", exists: true },
               support: { arn: "arn:aws:iam::1:role/HCP-ROSA-Support-Role", exists: true },
               worker: { arn: "arn:aws:iam::1:role/HCP-ROSA-Worker-Role", exists: true } }
      elb_role: true
      subnets: "{{ fx['aws-subnets'] }}"
      tag_count: 12
    expect: { blocking: false, status: { "OIDC config": ok, "IAM installer role": ok, "subnet tag headroom": ok } }

  - name: empty account - missing roles, ELB role, OIDC; split VPC
    step: aws
    raw:
      identity: "{{ fx['aws-identity'] }}"
      rosa_logged_in: true
      oidc_configs: []
      roles: { installer: { arn: "arn:aws:iam::1:role/HCP-ROSA-Installer-Role", exists: false },
               support: { arn: "arn:aws:iam::1:role/HCP-ROSA-Support-Role", exists: true },
               worker: { arn: "arn:aws:iam::1:role/HCP-ROSA-Worker-Role", exists: true } }
      elb_role: false
      subnets: "{{ fx['aws-subnets-split-vpc'] }}"
      tag_count: 45
    expect:
      blocking: true
      status: { "OIDC config": fail, "IAM installer role": fail, "ELB service-linked role": fail,
                "subnet pair": fail, "subnet tag headroom": fail }
      detail: ["rosa create account-roles --mode auto --hosted-cp", "create-service-linked-role"]

  - name: no AWS session
    step: aws
    raw: { identity: null }
    expect: { blocking: true, status: { session: fail } }

  # ---- approved SRS (local file) -------------------------------------------------------
  - name: approved SRS present with the configured digest
    step: srs
    workload: { srs_sha256: "{{ 'ab' * 32 }}" }
    raw: { path: ~/.ezkl/srs/kzg19.srs, exists: true, sha256: "{{ 'ab' * 32 }}" }
    expect: { blocking: false, status: { approved SRS file: ok } }

  - name: the collection's kzg19 default digest is accepted, the file still hashed
    step: srs
    workload: { srs_sha256: d1a1655b4366a766d1578beb257849a92bf91cb1358c1a2c37ab180c5d3a204d }
    facts: { _sg_raw_workload: { defaults: { serveguard_srs_sha256: d1a1655b4366a766d1578beb257849a92bf91cb1358c1a2c37ab180c5d3a204d } } }
    raw: { path: ~/.ezkl/srs/kzg19.srs, exists: true, sha256: d1a1655b4366a766d1578beb257849a92bf91cb1358c1a2c37ab180c5d3a204d }
    expect: { blocking: false, status: { approved digest: ok, approved SRS file: ok }, detail: ["collection default for kzg19, EZKL v23.0.5 list"] }

  - name: the default digest, but the local file differs -> fail
    step: srs
    workload: { srs_sha256: d1a1655b4366a766d1578beb257849a92bf91cb1358c1a2c37ab180c5d3a204d }
    facts: { _sg_raw_workload: { defaults: { serveguard_srs_sha256: d1a1655b4366a766d1578beb257849a92bf91cb1358c1a2c37ab180c5d3a204d } } }
    raw: { path: ~/.ezkl/srs/kzg19.srs, exists: true, sha256: "{{ 'ab' * 32 }}" }
    expect: { blocking: true, status: { approved digest: ok, approved SRS file: fail } }

  - name: an overriding digest is reported as an override
    step: srs
    workload: { srs_sha256: "{{ 'ab' * 32 }}" }
    facts: { _sg_raw_workload: { defaults: { serveguard_srs_sha256: d1a1655b4366a766d1578beb257849a92bf91cb1358c1a2c37ab180c5d3a204d } } }
    raw: { path: /srs/other.srs, exists: true, sha256: "{{ 'ab' * 32 }}" }
    expect: { blocking: false, detail: ["override of the collection default"] }

  - name: SRS with another digest -> fail
    step: srs
    workload: { srs_sha256: "{{ 'ab' * 32 }}" }
    raw: { path: ~/.ezkl/srs/kzg19.srs, exists: true, sha256: "{{ 'cd' * 32 }}" }
    expect: { blocking: true, status: { approved SRS file: fail }, detail: ["not the approved"] }

  - name: SRS not supplied -> fail with how to supply it (never downloaded)
    step: srs
    workload: { srs_sha256: "" }
    raw: { path: "", exists: false, sha256: "" }
    expect: { blocking: true, status: { approved digest: fail, approved SRS file: fail }, detail: ["kzg19.srs", "never downloaded"] }

  - name: SRS path missing on disk -> fail
    step: srs
    workload: { srs_sha256: "{{ 'ab' * 32 }}" }
    raw: { path: /nope/kzg19.srs, exists: false, sha256: "" }
    expect: { blocking: true, status: { approved SRS file: fail }, detail: ["/nope/kzg19.srs not found"] }

  # ---- OpenShift version for a new cluster ----------------------------------------------
  - name: guide range picks the newest enabled stable 4.20.z
    step: versions
    raw: { cluster_exists: false, versions: "{{ fx['rosa-versions'] }}" }
    expect: { blocking: false, status: { version to create: ok }, detail: ["4.20.12, the newest ROSA HCP version in 4.19.9 <= v < 4.21"] }

  - name: article range (override) picks 4.22.z and warns
    step: versions
    vars: { serveguard_openshift_range: article }
    raw: { cluster_exists: false, versions: "{{ fx['rosa-versions'] }}" }
    expect: { blocking: false, status: { version to create: ok, source: warn }, detail: ["4.22.1"] }

  - name: no version in range -> fail
    step: versions
    raw: { cluster_exists: false, versions: "{{ fx['rosa-versions'] | selectattr('raw_id', 'match', '4\\.(18|21|22|23)') | list }}" }
    expect: { blocking: true, status: { version to create: fail } }

  - name: existing cluster -> version n/a
    step: versions
    raw: { cluster_exists: true, versions: null }
    expect: { blocking: false, status: { version to create: n/a } }

  # ---- receiver composition certificate -----------------------------------------------------
  - name: no receiver required -> n/a; no anchor yet
    step: receiver
    raw: { path: "", exists: false, descriptor: null, parse_error: "", cluster_reachable: true, anchor: null }
    expect: { blocking: false, status: { receiver: n/a, trust anchor: todo } }

  - name: receiver required with the SmolLM2 descriptor
    step: receiver
    workload: { receiver_required: true }
    raw: { path: evidence/receiver-smollm2.json, exists: true, parse_error: "", cluster_reachable: true, anchor: null,
           descriptor: "{{ fx['receiver-smollm2'] }}" }
    expect: { blocking: false, status: { descriptor: ok, stories: ok, trust anchor: todo }, detail: ["+4: receiver-admitted"] }

  - name: receiver required, no descriptor given -> fail
    step: receiver
    workload: { receiver_required: true }
    raw: { path: "", exists: false, descriptor: null, parse_error: "", cluster_reachable: false, anchor: null }
    expect: { blocking: true, status: { descriptor: fail }, detail: ["evidence/receiver-smollm2.json"] }

  - name: receiver descriptor of another schema -> fail
    step: receiver
    workload: { receiver_required: true }
    raw: { path: r.json, exists: true, parse_error: "", cluster_reachable: false, anchor: null, descriptor: { schema: other, detector_digest: 4444444444444444444444444444444444444444444444444444444444444444 } }
    expect: { blocking: true, status: { descriptor: fail } }

  - name: receiver descriptor not JSON -> fail
    step: receiver
    workload: { receiver_required: true }
    raw: { path: r.json, exists: true, parse_error: "not a JSON object", cluster_reachable: false, anchor: null, descriptor: null }
    expect: { blocking: true, status: { descriptor: fail }, detail: ["is not JSON"] }

  - name: requiring a receiver over an anchor pinned without one -> conflict
    step: receiver
    workload: { receiver_required: true }
    raw: { path: r.json, exists: true, parse_error: "", cluster_reachable: true, descriptor: "{{ fx['receiver-smollm2'] }}",
           anchor: { schema: x, base_hash: y } }
    expect: { blocking: true, status: { trust anchor: conflict }, detail: ["adds a receiver", "fresh approve and a new VSA"] }

  - name: the same with serveguard_overrides.trust_anchor -> override
    step: receiver
    workload: { receiver_required: true, overrides: { trust_anchor: true } }
    raw: { path: r.json, exists: true, parse_error: "", cluster_reachable: true, descriptor: "{{ fx['receiver-smollm2'] }}",
           anchor: { schema: x, base_hash: y } }
    expect: { blocking: false, status: { trust anchor: override } }

  - name: dropping the receiver from a pinned anchor -> conflict
    step: receiver
    raw: { path: "", exists: false, parse_error: "", cluster_reachable: true, descriptor: null,
           anchor: { schema: x, receiver: { detector_digest: 4444444444444444444444444444444444444444444444444444444444444444 } } }
    expect: { blocking: true, status: { trust anchor: conflict }, detail: ["drops the receiver"] }

  - name: a pinned anchor with another detector -> conflict
    step: receiver
    workload: { receiver_required: true }
    raw: { path: r.json, exists: true, parse_error: "", cluster_reachable: true, descriptor: "{{ fx['receiver-smollm2'] }}",
           anchor: { schema: x, receiver: { detector_digest: 9999999999999999999999999999999999999999999999999999999999999999 } } }
    expect: { blocking: true, status: { trust anchor: conflict }, detail: ["changes the detector"] }

  - name: the pinned anchor already requires this receiver -> ok
    step: receiver
    workload: { receiver_required: true }
    raw: { path: r.json, exists: true, parse_error: "", cluster_reachable: true, descriptor: "{{ fx['receiver-smollm2'] }}",
           anchor: "{{ {'schema': 'x', 'receiver': {'detector_digest': fx['receiver-smollm2'].detector_digest}} }}" }
    expect: { blocking: false, status: { trust anchor: ok } }

  - name: receiver with Kyverno -> the policy also requires SERVEGUARD_COMPOSITION_V1
    step: receiver
    workload: { receiver_required: true, enforcer: kyverno }
    raw: { path: r.json, exists: true, parse_error: "", cluster_reachable: false, anchor: null, descriptor: "{{ fx['receiver-smollm2'] }}" }
    expect: { blocking: false, status: { Kyverno: ok }, detail: ["SERVEGUARD_COMPOSITION_V1"] }

  - name: caps beta and gamma from the collection
    step: workload
    raw:
      collection: { name: serveguard.openshift_ai, version: "0.1.0", path: /c/serveguard/openshift_ai }
      defaults: { serveguard_predictor_cpu: "4", serveguard_predictor_memory: 8Gi, serveguard_publish_cpu: "4", serveguard_publish_memory: 16Gi,
                  serveguard_approve_cpu: "4", serveguard_approve_memory: 16Gi, serveguard_max_write_norm: 4.0, serveguard_max_typed_gain: 16.0 }
      overrides: {}
    expect: { blocking: false, status: { cap beta: ok, cap gamma: ok }, detail: ["||B_s C||_2 <= 16.0"] }

  - name: a non-positive gamma -> fail
    step: workload
    raw:
      collection: { name: serveguard.openshift_ai, version: "0.1.0", path: /c/serveguard/openshift_ai }
      defaults: { serveguard_predictor_cpu: "4", serveguard_predictor_memory: 8Gi, serveguard_publish_cpu: "4", serveguard_publish_memory: 16Gi,
                  serveguard_approve_cpu: "4", serveguard_approve_memory: 16Gi, serveguard_max_write_norm: 4.0, serveguard_max_typed_gain: 16.0 }
      overrides: { serveguard_max_typed_gain: 0 }
    expect: { blocking: true, status: { cap gamma: fail } }

  - name: the github.com URI base (collection default) -> no placeholder warning
    step: workload
    raw:
      collection: { name: serveguard.openshift_ai, version: "0.1.0", path: /c/serveguard/openshift_ai }
      defaults: { serveguard_predictor_cpu: "4", serveguard_predictor_memory: 8Gi, serveguard_publish_cpu: "4", serveguard_publish_memory: 16Gi,
                  serveguard_approve_cpu: "4", serveguard_approve_memory: 16Gi, serveguard_signing_mode: keypair,
                  serveguard_attestation_uri_base: "https://github.com/dahlem/serveguard/attestation" }
      overrides: {}
    expect: { blocking: false, status: { attestation URI base: ~ } }

  # ---- supply-chain attestation (ADR-0001) ------------------------------------------------
  - name: keypair + vap with no keys yet -> the collection generates them
    step: signing
    raw: { keys: {} }
    expect: { blocking: false, status: { mode: ok, key pairs: todo }, detail: ["keypair signing, vap enforcement"] }

  - name: keypair with all three pairs -> reused
    step: signing
    raw: { keys: { operator: [k/operator.key, k/operator.pub], publisher: [k/publisher.key, k/publisher.pub], verifier: [k/verifier.key, k/verifier.pub] } }
    expect: { blocking: false, status: { key pairs: ok } }

  - name: keypair with a missing role -> the collection generates only that one
    step: signing
    raw: { keys: { operator: [k/operator.key, k/operator.pub], publisher: [], verifier: [k/verifier.key, k/verifier.pub] } }
    expect: { blocking: false, status: { key pairs: todo }, detail: ["reusing operator, verifier; the collection generates publisher"] }

  - name: keypair with a half pair -> conflict
    step: signing
    raw: { keys: { operator: [k/operator.key, k/operator.pub], publisher: [k/publisher.pub], verifier: [k/verifier.key, k/verifier.pub] } }
    expect: { blocking: true, status: { key pairs: conflict }, detail: ["half pairs in", "publisher"] }

  - name: keyless with only the operator pair -> complete (publisher/verifier use Fulcio)
    step: signing
    workload: { signing_mode: keyless }
    raw: { keys: { operator: [k/operator.key, k/operator.pub] } }
    expect: { blocking: false, status: { key pairs: ok }, detail: ["reusing operator key pairs"] }

  - name: keyless needs the operator key (it signs the trust anchor)
    step: signing
    workload: { signing_mode: keyless }
    raw: { keys: { operator: [k/operator.key] } }
    expect: { blocking: true, status: { key pairs: conflict, trust anchor: ok } }

  - name: keyless on a supported OpenShift -> ok
    step: signing
    workload: { signing_mode: keyless }
    raw: { keys: {} }
    expect: { blocking: false, status: { RHTAS on OpenShift: ok, key pairs: todo }, detail: ["4.20.12 in 4.16.0 <= v < 4.22", "operator.key/.pub"] }

  - name: keyless on 4.22 (article range) -> RHTAS unsupported
    step: signing
    workload: { signing_mode: keyless }
    facts: { _sg_versions: { version: "4.22.1" } }
    raw: { keys: {} }
    expect: { blocking: true, status: { RHTAS on OpenShift: fail } }

  - name: unknown mode or enforcer -> fail
    step: signing
    workload: { signing_mode: gpg, enforcer: opa }
    raw: { keys: {} }
    expect: { blocking: true, status: { signing mode: fail, enforcer: fail } }

  - name: vap enforcer -> Kyverno not needed
    step: kyverno
    raw: { cluster_reachable: true, crd: false, subscription: null, deployments: [] }
    expect: { action: none, blocking: false, status: { Kyverno: n/a } }

  - name: kyverno enforcer on a fresh cluster -> install
    step: kyverno
    workload: { enforcer: kyverno }
    raw: { cluster_reachable: true, crd: false, subscription: null, deployments: [] }
    expect: { action: install, blocking: false, status: { Kyverno: todo } }

  - name: our Kyverno, ready at 1.13, with a registry pull secret -> skip
    step: kyverno
    workload: { enforcer: kyverno }
    raw: { cluster_reachable: true, crd: true, subscription: "{{ fx['kyverno-sub'] }}", secrets: [sg-registry],
           deployments: "{{ fx['kyverno-dep-ready'] | map('combine', {'spec': {'template': {'spec': {'containers': [{'name': 'kyverno', 'image': 'reg.nirmata.io/nirmata/kyverno:v1.13.4', 'args': ['--imagePullSecrets=sg-registry']}]}}}}) | list }}" }
    expect: { action: satisfied, blocking: false, status: { version: ok, admission controller: satisfied, namespace: ok, registry credentials: ok } }

  - name: Kyverno without pull credentials for the internal registry -> warn
    step: kyverno
    workload: { enforcer: kyverno }
    raw: { cluster_reachable: true, crd: true, subscription: "{{ fx['kyverno-sub'] }}", secrets: [], deployments: "{{ fx['kyverno-dep-ready'] }}" }
    expect: { action: satisfied, blocking: false, status: { registry credentials: warn }, detail: ["cannot fetch the VSA"] }

  - name: Kyverno names a pull secret that does not exist -> fail
    step: kyverno
    workload: { enforcer: kyverno }
    raw: { cluster_reachable: true, crd: true, subscription: "{{ fx['kyverno-sub'] }}", secrets: [],
           deployments: "{{ fx['kyverno-dep-ready'] | map('combine', {'spec': {'template': {'spec': {'containers': [{'name': 'kyverno', 'image': 'k:v1.13.4', 'args': ['--imagePullSecrets=sg-registry']}]}}}}) | list }}" }
    expect: { action: none, blocking: true, status: { registry credentials: fail } }

  - name: Kyverno in another namespace than the collection grants -> conflict
    step: kyverno
    workload: { enforcer: kyverno, kyverno_namespace: kyverno }
    vars: { serveguard_allow_existing_kyverno: true }
    raw: { cluster_reachable: true, crd: true, subscription: null, secrets: [], deployments: "{{ fx['kyverno-dep-helm'] }}" }
    expect: { action: none, blocking: true, status: { namespace: conflict }, detail: ["serveguard_kyverno_namespace=kyverno-helm"] }

  - name: our operator subscribed, no instance yet -> create the instance
    step: kyverno
    workload: { enforcer: kyverno }
    raw: { cluster_reachable: true, crd: false, subscription: "{{ fx['kyverno-sub'] }}", deployments: [] }
    expect: { action: instance, blocking: false }

  - name: our Kyverno not ready yet -> wait (instance step waits)
    step: kyverno
    workload: { enforcer: kyverno }
    raw: { cluster_reachable: true, crd: true, subscription: "{{ fx['kyverno-sub'] }}", deployments: "{{ fx['kyverno-dep-notready'] }}" }
    expect: { action: instance, blocking: false, status: { admission controller: wait } }

  - name: a Helm-installed Kyverno -> conflict
    step: kyverno
    workload: { enforcer: kyverno }
    raw: { cluster_reachable: true, crd: true, subscription: null, deployments: "{{ fx['kyverno-dep-helm'] }}" }
    expect: { action: none, blocking: true, status: { existing Kyverno: conflict }, detail: ["admission controller in kyverno-helm"] }

  - name: the Helm Kyverno with the override (namespace aligned) -> accepted, not subscribed
    step: kyverno
    workload: { enforcer: kyverno, kyverno_namespace: kyverno-helm }
    vars: { serveguard_allow_existing_kyverno: true }
    raw: { cluster_reachable: true, crd: true, subscription: null, deployments: "{{ fx['kyverno-dep-helm'] }}" }
    expect: { action: accept, blocking: false, status: { existing Kyverno: override, version: ok } }

  - name: Kyverno 1.11 -> fail (verifyImages attestations need 1.12)
    step: kyverno
    workload: { enforcer: kyverno }
    raw: { cluster_reachable: true, crd: true, subscription: "{{ fx['kyverno-sub'] }}", deployments: "{{ fx['kyverno-dep-old'] }}" }
    expect: { action: none, blocking: true, status: { version: fail } }

  - name: keypair -> RHTAS not needed
    step: rhtas
    raw: { cluster_reachable: true, crd: false, securesigns: [], components: {}, issuer: "" }
    expect: { action: none, blocking: false, status: { RHTAS: n/a } }

  - name: keyless, operator not installed yet -> create after it
    step: rhtas
    workload: { signing_mode: keyless }
    raw: { cluster_reachable: true, crd: false, securesigns: [], components: {}, issuer: "https://oidc.op1.openshiftapps.com/2abc" }
    expect: { action: create, blocking: false, status: { service-account issuer: ok, Securesign: todo }, detail: ["from authentication.config.openshift.io/cluster"] }

  - name: keyless, Securesign trusting our issuer, all Ready -> skip
    step: rhtas
    workload: { signing_mode: keyless }
    raw: { cluster_reachable: true, crd: true, securesigns: ["{{ fx['securesign-ours'] }}"], components: "{{ fx['rhtas-components-ready'] }}",
           issuer: "https://oidc.op1.openshiftapps.com/2abc" }
    expect: { action: satisfied, blocking: false, status: { Securesign: satisfied } }

  - name: keyless, Rekor not Ready -> wait
    step: rhtas
    workload: { signing_mode: keyless }
    raw: { cluster_reachable: true, crd: true, securesigns: ["{{ fx['securesign-ours'] }}"], components: "{{ fx['rhtas-components-partial'] }}",
           issuer: "https://oidc.op1.openshiftapps.com/2abc" }
    expect: { action: wait, blocking: false, detail: ["not Ready: Rekor"] }

  - name: keyless, Securesign without the kubernetes issuer -> conflict
    step: rhtas
    workload: { signing_mode: keyless }
