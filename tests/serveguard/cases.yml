  - name: DSC differs with override -> update
    step: platform
    vars: { serveguard_allow_dsc_update: true }
    facts: { _sg_operators: { subset: [] } }
    raw: { cluster_reachable: true, dsc_crd: true, dscs: ["{{ fx['dsc-full'] }}"], dscis: ["{{ fx['dsci-default'] }}"], kserve: "{{ fx['kserve-ready'] }}" }
    expect: { action: update, blocking: false, status: { DataScienceCluster: override } }

  - name: DSC under another name, foreign DSCI -> conflict
    step: platform
    facts: { _sg_operators: { subset: [] } }
    raw: { cluster_reachable: true, dsc_crd: true, dscs: ["{{ fx['dsc-other-name'] }}"], dscis: ["{{ fx['dsci-other'] }}"], kserve: null }
    expect: { action: none, blocking: true, status: { DSCInitialization: conflict }, detail: ["rhods exists; only one DSC per cluster"] }

  # ---- GPU stack ---------------------------------------------------------------------------
  - name: GPU allocatable and ClusterPolicy ready -> skip
    step: gpu_stack
    vars: { serveguard_pool_instance_type: g6.2xlarge }
    raw: { cluster_reachable: true, nodes: "{{ fx['nodes-gpu'][1:] }}", cluster_policy: { status: { state: ready } } }
    expect: { action: satisfied, blocking: false }

  - name: GPU node without driver yet -> install
    step: gpu_stack
    vars: { serveguard_pool_instance_type: g6.2xlarge }
    raw: { cluster_reachable: true, nodes: "{{ [fx['nodes-gpu'][1] | combine({'status': {'allocatable': {'cpu': '7500m'}, 'conditions': [{'type': 'Ready', 'status': 'True'}]}})] }}", cluster_policy: null }
    expect: { action: install, blocking: false }

  # ---- registry, storage ---------------------------------------------------------------------
  - name: registry Managed with storage
    step: registry
    raw: { cluster_reachable: true, config: "{{ fx['registry-managed'] }}", deployment: "{{ fx['registry-deploy'] }}" }
    expect: { blocking: false, status: { managementState: ok, "image-registry deployment": ok } }

  - name: registry Removed (bare-metal SNO style) -> fail
    step: registry
    raw: { cluster_reachable: true, config: "{{ fx['registry-removed'] }}", deployment: null }
    expect: { blocking: true, status: { managementState: fail } }

  - name: internal registry not needed with an external receiver image and adapter registry
    step: registry
    workload: { receiver_image: "quay.io/me/serveguard-receiver:1", registry: registry.example.com }
    raw: { cluster_reachable: true, config: "{{ fx['registry-removed'] }}", deployment: null }
    expect: { blocking: false, status: { "internal registry": n/a } }

  - name: default gp3 StorageClass
    step: storage
    raw: { cluster_reachable: true, storage_classes: "{{ fx['sc-gp3-default'] }}" }
    expect: { blocking: false, status: { StorageClass: ok } }

  - name: no default StorageClass
    step: storage
    raw: { cluster_reachable: true, storage_classes: "{{ fx['sc-no-default'] }}" }
    expect: { blocking: true, status: { StorageClass: fail }, detail: ["no default StorageClass"] }

  - name: ReadWriteMany (collection setting) on EBS -> fail
    step: storage
    workload: { store_access_mode: ReadWriteMany }
    raw: { cluster_reachable: true, storage_classes: "{{ fx['sc-gp3-default'] }}" }
    expect: { blocking: true, status: { StorageClass: fail }, detail: ["cannot provide ReadWriteMany"] }

  # ---- capacity --------------------------------------------------------------------------------
  - name: CPU demo fits; the demo's own old predictor is not counted
    step: capacity
    raw: { cluster_reachable: true, nodes: "{{ fx['nodes-cpu'] }}", pods: "{{ fx['pods-light'] }}" }
    expect:
      blocking: false
      status: { "schedulable nodes": ok, "receiver build": ok, "predictor (+guard init)": ok, "predictor + story Job": ok }
      detail: ["fits on ip-10-0-1-3"]

  - name: publish (4 CPU / 16Gi + 16Gi proving-key volume) fits a worker
    step: capacity
    raw: { cluster_reachable: true, nodes: "{{ fx['nodes-cpu'] }}", pods: "{{ fx['pods-light'] }}" }
    expect: { blocking: false, status: { "publisher prove Job": ok, "verifier approve Job": ok, "verifier admit Job": ok }, detail: ["4 CPU / 16.0Gi / 16.0Gi ephemeral fits"] }

  - name: publish with more memory than any node has free -> fail
    step: capacity
    workload: { publish_memory: 40Gi }
    raw: { cluster_reachable: true, nodes: "{{ fx['nodes-cpu'] }}", pods: "{{ fx['pods-light'] }}" }
    expect: { blocking: true, status: { "publisher prove Job": fail, "verifier approve Job": ok } }

  - name: pods of all three trust domains are not counted as used
    step: capacity
    raw: { cluster_reachable: true, nodes: "{{ fx['nodes-cpu'] }}", pods: "{{ fx['pods-trust-domains'] }}" }
    expect: { blocking: false, status: { "predictor + story Job": ok, "publisher prove Job": ok } }

  - name: busy cluster -> predictor does not fit
    step: capacity
    raw: { cluster_reachable: true, nodes: "{{ fx['nodes-cpu'] }}", pods: "{{ fx['pods-busy'] }}" }
    expect:
      blocking: true
      status: { "receiver build": ok, "predictor (+guard init)": fail, "predictor + story Job": fail }
      detail: ["no schedulable node has 4 CPU / 8.0Gi / 30.0Gi ephemeral free"]

  - name: a pod's init container counts as its request (max of init, sum of main)
    step: capacity
    raw: { cluster_reachable: true, nodes: "{{ fx['nodes-cpu'] }}", pods: "{{ fx['pods-init'] }}" }
    expect: { blocking: true, status: { "predictor (+guard init)": ok, "predictor + story Job": fail }, detail: ["fits on ip-10-0-1-3 (free 4 CPU"] }

  - name: 4 vCPU workers, serving pool still to be created -> n/a, not fail
    step: capacity
    facts: { _sg_pool: { action: create } }
    raw: { cluster_reachable: true, nodes: "{{ fx['nodes-small'] }}", pods: [] }
    expect: { blocking: false, status: { "predictor (+guard init)": n/a, "tools Job": ok } }

  - name: 4 vCPU workers cannot hold a 4 CPU predictor
    step: capacity
    facts: { _sg_pool: { action: satisfied } }
    raw: { cluster_reachable: true, nodes: "{{ fx['nodes-small'] }}", pods: [] }
    expect: { blocking: true, status: { "predictor (+guard init)": fail } }

  - name: bigger predictor (override of the collection default) no longer fits
    step: capacity
    workload: { predictor_cpu: "7", predictor_memory: 24Gi }
    raw: { cluster_reachable: true, nodes: "{{ fx['nodes-cpu'] }}", pods: "{{ fx['pods-light'] }}" }
    expect: { blocking: true, status: { "predictor + story Job": fail }, detail: ["no schedulable node has 7.5 CPU / 25.0Gi"] }

  - name: GPU node tainted -> GPU predictor cannot schedule
    step: capacity
    vars: { serveguard_accelerator: nvidia }
    raw: { cluster_reachable: true, nodes: "{{ fx['nodes-gpu-tainted'] }}", pods: [] }
    expect: { blocking: true, status: { "predictor (+guard init)": fail }, detail: ["/ 1 GPU"] }

  - name: GPU node untainted -> GPU predictor fits
    step: capacity
    vars: { serveguard_accelerator: nvidia }
    raw: { cluster_reachable: true, nodes: "{{ fx['nodes-gpu'] }}", pods: [] }
    expect: { blocking: false, status: { "predictor (+guard init)": ok }, detail: ["fits on ip-10-0-2-1"] }
