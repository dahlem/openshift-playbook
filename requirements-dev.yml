---
# Local development: install serveguard.openshift_ai from the sibling checkout
# (../serveguard) instead of git. Run from this repository's root, and re-run with
# --force after changing the collection:
#   ansible-galaxy collection install -r requirements-dev.yml --force
collections:
  - name: kubernetes.core
    version: ">=3.0.0"
  - name: amazon.aws
    version: ">=7.0.0"
  - name: ../serveguard/integrations/openshift-ai/ansible
    type: dir
