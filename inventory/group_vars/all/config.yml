---
# ============================================================
# Public defaults — safe to commit
# ============================================================

# Version constraints (loaded from versions.yml)
versions_file: "{{ playbook_dir }}/../versions.yml"

# Operators — keys of versions.operators to install, in install order.
# Scenarios override the list (serveguard: cert_manager + rhoai, optionally nfd + gpu).
operators_enabled: [nfd, gpu, serverless, servicemesh, rhoai]
rhoai_channel: "{{ versions.operators.rhoai.channel }}"

# AI platform — serverless: DSC v1, KServe on Knative + Service Mesh (Mistral scenarios)
#               standard:   DSC v2, KServe standard (RawDeployment) only (RHOAI 3.x)
ai_platform_mode: serverless

# GPU Machine Pool
gpu_pool_name: gpu
gpu_pool_autoscaling: true
gpu_pool_min_replicas: 1          # ROSA requires min >= 1 when autoscaling is enabled
gpu_pool_max_replicas: 1
gpu_pool_taint: "nvidia.com/gpu=present:NoSchedule"   # "" = no taint

# Model Serving
model_name: mistral-7b
model_storage_uri: "hf://RedHatAI/Mistral-7B-Instruct-v0.3-quantized.w4a16"
model_namespace: default
model_use_builtin_runtime: false

# vLLM Runtime Tuning
vllm_tensor_parallel_size: 1
vllm_max_model_len: 4096
vllm_gpu_memory_utilization: "0.9"
vllm_extra_args: []
gpu_per_pod: 1

# Knative Autoscaling
knative_concurrency_target: "10"

# Timeouts (seconds)
cluster_wait_timeout: 3600
crd_wait_timeout: 600
node_wait_timeout: 900
model_wait_timeout: 1800

# Batch Experiment Infrastructure
batch_namespace: batch-experiments
batch_gpu_quota: 8
batch_cpu_quota: 32
batch_memory_quota: 64Gi
batch_service_account: batch-runner
batch_results_pvc_name: batch-results
batch_results_pvc_size: 50Gi
batch_results_access_mode: ReadWriteMany
batch_results_storage_class: gp3-csi
batch_model_cache_enabled: true
batch_model_cache_pvc_name: model-cache
batch_model_cache_pvc_size: 100Gi
batch_model_cache_models: []
batch_model_cache_provider: huggingface
batch_model_cache_token_secret: ""
batch_workflow_operator_channel: stable
batch_workflow_namespace: batch-experiments

# ServeGuard OpenShift AI demo (playbooks/serveguard-demo*.yml, scenarios/serveguard/)
# The workload (trust anchor, receiver image, publisher, public verifier, serving
# consumer, stories; the paper's trust model) is the
# serveguard.openshift_ai collection; its role defaults are the single source of
# the workload's settings and resource requests. Nothing here restates them: the
# platform checks read them from the collection (serveguard_checks pre_workload),
# and a scenario or -e that sets one of these variables overrides it for both.
serveguard_collection: serveguard.openshift_ai
# Every collection variable is defined once, in roles/common/defaults/main.yml.
serveguard_collection_roles: [common]
# Workload variables the platform checks need -> their names in the collection.
serveguard_workload_vars:
  predictor_cpu: serveguard_predictor_cpu            # collection default "4"
  predictor_memory: serveguard_predictor_memory      # collection default "8Gi"
  namespace: serveguard_namespace
  receiver_image: serveguard_image                   # "" = in-cluster build -> internal registry
  storage_class: serveguard_storage_class            # "" = the cluster default
  store_access_mode: serveguard_store_access_mode
  publisher_namespace: serveguard_publisher_namespace  # sg-publisher
  verifier_namespace: serveguard_verifier_namespace    # sg-verifier
  # Other workloads: serveguard_<workload>_cpu / _memory
  build_cpu: serveguard_receiver_build_cpu           # receiver image build
  build_memory: serveguard_receiver_build_memory
  job_cpu: serveguard_job_cpu                        # fetch-base, loaders, story prepare Jobs
  job_memory: serveguard_job_memory
  guard_cpu: serveguard_guard_cpu                    # guard init-container of the predictor
  guard_memory: serveguard_guard_memory
  approve_cpu: serveguard_approve_cpu                # verifier derives its circuits (~11.5 GB peak)
  approve_memory: serveguard_approve_memory
  publish_cpu: serveguard_publish_cpu                # publisher proves (~12.4 GB peak)
  publish_memory: serveguard_publish_memory
  admit_cpu: serveguard_admit_cpu                    # verifier admits
  admit_memory: serveguard_admit_memory
  work_size: serveguard_work_size                    # emptyDir for proving keys (publish, approve)
  logrows: serveguard_logrows                        # names the SRS (kzg<logrows>.srs)
# These must be in the collection's defaults (or overridden); the rest are optional.
serveguard_workload_required: [predictor_cpu, predictor_memory, publish_cpu, publish_memory, approve_cpu, approve_memory]
# Environment bindings the collection needs from this checkout layout (not workload
# defaults): the serveguard checkout (receiver_image builds from it) and its CLI.
serveguard_repo_dir: "{{ (playbook_dir ~ '/../../serveguard') | realpath }}"
serveguard_cli: "uv run --project {{ serveguard_repo_dir }}/integrations/openshift-ai --frozen serveguard-openshift-ai"
# The approved KZG SRS is site-specific: set serveguard_srs_path and
# serveguard_srs_sha256 in inventory/group_vars/all/site.yml or with -e.
# OpenShift range for RHOAI 3.5 (versions.yml serveguard.requirements.openshift):
#   guide (both sources agree, latest 4.20.z) | article (up to 4.22.z)
serveguard_openshift_range: guide
serveguard_run_stories: true
# Platform-side sizing (not workload settings):
serveguard_min_node_ephemeral: 30Gi          # vLLM image + model on the predictor's node
# Estimated per-node system reservation + daemonsets, for the plan check before
# the cluster or pool exists (OpenShift reserves CPU/memory on every node).
serveguard_node_overhead: { cpu: 1500m, memory: 4Gi }
# Overrides: accept a conflicting existing resource instead of stopping.
serveguard_allow_cluster_version: false      # cluster outside the supported OpenShift range
serveguard_allow_pool_mismatch: false        # use an existing pool whose spec differs
serveguard_allow_channel_change: false       # move an existing Subscription to the requested channel
serveguard_allow_dsc_update: false           # change component states of an existing DSC
