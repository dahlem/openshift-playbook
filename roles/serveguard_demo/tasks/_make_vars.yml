---
# The integration Makefile's parameters, as make command-line assignments.
# The predictor size is passed only when this Makefile declares the parameters.

- name: Read the Makefile's declared parameters
  ansible.builtin.slurp:
    src: "{{ serveguard_integration_dir }}/Makefile"
  register: _sg_makefile_body

- name: Assemble Makefile parameters
  ansible.builtin.set_fact:
    _sg_make_vars: >-
      {{ [
           'NAMESPACE=' ~ serveguard_namespace,
           'ISVC=' ~ serveguard_isvc,
           'ACCELERATOR=' ~ serveguard_accelerator,
           'VLLM_IMAGE=' ~ serveguard_vllm_image,
           'MODEL=' ~ serveguard_model,
           'MODEL_REVISION=' ~ serveguard_model_revision,
           'RHOAI_CHANNEL=' ~ rhoai_channel,
           'TIMEOUT=' ~ serveguard_make_timeout,
         ]
         + (['IMAGE=' ~ serveguard_image] if serveguard_image | length > 0 else [])
         + (['STORAGE_CLASS=' ~ serveguard_storage_class] if serveguard_storage_class | length > 0 else [])
         + (['STORE_ACCESS_MODE=' ~ serveguard_store_access_mode] if 'STORE_ACCESS_MODE' in _sg_declared else [])
         + ([serveguard_make_param_predictor_cpu ~ '=' ~ serveguard_predictor_cpu,
             serveguard_make_param_predictor_memory ~ '=' ~ serveguard_predictor_memory]
            if serveguard_make_param_predictor_cpu in _sg_declared and serveguard_make_param_predictor_memory in _sg_declared
            else []) }}
  vars:
    _sg_declared: "{{ _sg_makefile_body.content | b64decode | regex_findall('(?m)^([A-Z][A-Z0-9_]*)\\s*\\?=') }}"
