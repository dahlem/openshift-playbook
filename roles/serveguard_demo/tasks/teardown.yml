---
# make demo-down: deletes the demo namespace, then the cluster-scoped
# ValidatingAdmissionPolicy and its binding. Falls back to deleting them
# directly when the serveguard checkout is not present.

- name: Load version constraints
  ansible.builtin.include_vars:
    file: "{{ versions_file }}"
    name: versions
  when: versions is not defined

- name: Check the serveguard integration Makefile
  ansible.builtin.stat:
    path: "{{ serveguard_integration_dir }}/Makefile"
  register: _sg_makefile

- name: Assemble Makefile parameters
  ansible.builtin.include_tasks: _make_vars.yml
  when: _sg_makefile.stat.exists

- name: Run make demo-down
  ansible.builtin.command:
    argv: "{{ ['make', 'demo-down'] + _sg_make_vars }}"
    chdir: "{{ serveguard_integration_dir }}"
  register: _sg_demo_down
  changed_when: true
  failed_when: false
  when: _sg_makefile.stat.exists

- name: Delete the demo namespace
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Namespace
    name: "{{ serveguard_namespace }}"
    wait: true
    wait_timeout: 600

- name: Delete the admission policy and binding
  kubernetes.core.k8s:
    state: absent
    api_version: admissionregistration.k8s.io/v1
    kind: "{{ item }}"
    name: "serveguard-admitted-adapters-{{ serveguard_namespace }}"
  loop:
    - ValidatingAdmissionPolicyBinding
    - ValidatingAdmissionPolicy
