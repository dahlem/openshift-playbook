---
# make demo-stories: the admitted adapter serves, then the four refusals
# (unadmitted service, forged verdict, tampered adapter, bytes changed after
# admission) and the restore. The Makefile exits non-zero on any unexpected
# outcome; this file only reports what it printed.

- name: Assemble Makefile parameters
  ansible.builtin.include_tasks: _make_vars.yml

- name: Run make demo-stories (about 10-15 min)
  ansible.builtin.command:
    argv: "{{ ['make', 'demo-stories'] + _sg_make_vars }}"
    chdir: "{{ serveguard_integration_dir }}"
  register: _sg_stories
  changed_when: true
  failed_when: false

- name: Create the log directory
  ansible.builtin.file:
    path: "{{ serveguard_log_dir }}"
    state: directory
    mode: "0755"

- name: Save the full story output
  ansible.builtin.copy:
    dest: "{{ serveguard_log_dir }}/serveguard-demo-stories-{{ lookup('pipe', 'date +%Y%m%dT%H%M%S') }}.log"
    content: "{{ _sg_stories.stdout }}\n--- stderr ---\n{{ _sg_stories.stderr }}\n"
    mode: "0644"
  register: _sg_log

# Each story section starts with a line "== <what is attempted>".
- name: Split the output into story sections
  ansible.builtin.set_fact:
    _sg_preamble: "{{ _sg_stories.stdout.split('\n== ')[0] }}"
    _sg_sections: "{{ _sg_stories.stdout.split('\n== ')[1:] }}"
    _sg_rows: []

- name: Summarise each story
  ansible.builtin.set_fact:
    _sg_rows: >-
      {{ _sg_rows + ['  ' ~ ('%-12s' | format(_verdict | trim)) ~ ' ' ~ _title]
         + (['               ' ~ _evidence] if _evidence | length > 0 else []) }}
  vars:
    _lines: "{{ item.splitlines() }}"
    _title: "{{ _lines[0] | regex_replace('^refusal: ', '') }}"
    _why: "{{ _lines[1:] | select('search', 'denied request|REFUSED|\"reason\"') | list }}"
    _init: "{{ _lines[1:] | select('search', 'Init:') | list }}"
    _done: "{{ _lines[1:] | select('search', 'condition met') | list }}"
    _evidence: >-
      {{ ((_why + _init + _done) | first | default('')
          | regex_replace('^.*"reason": *"([^"]*)".*$', 'reason: \1')
          | regex_replace('^.*denied request: *', 'denied: ')
          | regex_replace('^[ |]*', ''))[:110] }}
    _verdict: >-
      {{ 'NOT REFUSED' if 'UNEXPECTED' in item
         else ('restored' if _done | length > 0 else 'not observed') if _lines[0].startswith('restore')
         else 'refused' if ('=> denied' in item or _done | length > 0 or 'REFUSED' in item or 'Init:' in item)
         else 'not observed' }}
  loop: "{{ _sg_sections }}"
  loop_control:
    label: "{{ item.splitlines()[0] }}"

- name: Read the admitted adapter's completion
  ansible.builtin.set_fact:
    _sg_completion: "{{ _sg_preamble | regex_search('\"text\"\\s*:\\s*\"([^\"]*)\"', '\\1') | default([''], true) | first }}"

- name: ServeGuard story summary
  ansible.builtin.debug:
    msg: "{{ _head + _rows + _tail }}"
  vars:
    _head:
      - ""
      - "============================================================"
      - "  ServeGuard on OpenShift AI: {{ 'all stories as expected' if _sg_stories.rc == 0 else 'FAILED (make rc=' ~ _sg_stories.rc ~ ')' }}"
      - "============================================================"
      - ""
      - "  {{ '%-12s' | format('served' if _sg_completion | length > 0 else 'no reply') }} admitted adapter answers: {{ _sg_completion[:60] | to_json }}"
    _rows: "{{ _sg_rows }}"
    _tail:
      - ""
      - "  Full output: {{ _sg_log.dest }}"
      - ""
      - "============================================================"
      - ""

- name: Show the end of the story output
  ansible.builtin.debug:
    msg: "{{ (_sg_stories.stdout_lines + _sg_stories.stderr_lines)[-30:] }}"
  when: _sg_stories.rc != 0

- name: Fail when a story did not behave as expected
  ansible.builtin.fail:
    msg: "make demo-stories failed (rc={{ _sg_stories.rc }}). Full output: {{ _sg_log.dest }}"
  when: _sg_stories.rc != 0
