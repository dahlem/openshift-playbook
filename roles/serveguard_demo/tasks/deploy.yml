---
# make demo-up: namespace, PVC, receiver RBAC, the ValidatingAdmissionPolicy,
# in-cluster receiver build, fetch-base, publish, pins, admit, serve.

- name: Assemble Makefile parameters
  ansible.builtin.include_tasks: _make_vars.yml

- name: Run make demo-up (receiver build, publish, admit, serve; about 20-30 min)
  ansible.builtin.command:
    argv: "{{ ['make', 'demo-up'] + _sg_make_vars }}"
    chdir: "{{ serveguard_integration_dir }}"
  register: _sg_demo_up
  changed_when: true
  failed_when: false

- name: Show the end of the demo-up output
  ansible.builtin.debug:
    msg: "{{ (_sg_demo_up.stdout_lines + _sg_demo_up.stderr_lines)[-40:] }}"
  when: _sg_demo_up.rc != 0

- name: Fail when demo-up failed
  ansible.builtin.fail:
    msg: >-
      make demo-up failed (rc={{ _sg_demo_up.rc }}). Troubleshooting:
      {{ serveguard_repo_dir }}/docs/playbook/serveguard/openshift-ai.md
  when: _sg_demo_up.rc != 0
