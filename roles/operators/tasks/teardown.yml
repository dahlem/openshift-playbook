---
# Remove operator subscriptions and CSVs.
# CRDs and namespaces are left for manual cleanup to avoid data loss.

- name: Load version constraints
  ansible.builtin.include_vars:
    file: "{{ versions_file }}"
    name: versions
  when: versions is not defined

- name: Resolve enabled operators
  ansible.builtin.include_tasks: _resolve.yml

- name: Delete operator subscriptions
  kubernetes.core.k8s:
    state: absent
    api_version: operators.coreos.com/v1alpha1
    kind: Subscription
    namespace: "{{ item.subscription.namespace }}"
    name: "{{ item.subscription.name }}"
  loop: "{{ _operators | reverse | list }}"
  loop_control:
    label: "{{ item.subscription.name }}"
  failed_when: false

- name: Delete ClusterServiceVersions
  ansible.builtin.shell: |
    oc delete csv -n {{ item }} --all
  loop: "{{ _operators | reverse | map(attribute='subscription.namespace') | list }}"
  failed_when: false
  changed_when: true
