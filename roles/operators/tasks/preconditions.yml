---
# Pre: cluster ready, oc logged in, operator packages available in catalog

- name: Load version constraints
  ansible.builtin.include_vars:
    file: "{{ versions_file }}"
    name: versions
  when: versions is not defined

- name: Resolve enabled operators
  ansible.builtin.include_tasks: _resolve.yml

- name: Verify oc login
  ansible.builtin.command: oc whoami
  register: _oc_whoami
  changed_when: false
  failed_when: false

- name: Assert oc is logged in
  ansible.builtin.assert:
    that: _oc_whoami.rc == 0
    fail_msg: "Not logged in via oc. Run rosa_cluster step first, then oc login."

- name: Check operator marketplace is available
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    name: openshift-marketplace
  register: _marketplace

- name: Assert marketplace namespace exists
  ansible.builtin.assert:
    that: _marketplace.resources | length > 0
    fail_msg: "openshift-marketplace namespace not found. Is this an OpenShift cluster?"

- name: Check operator packages in catalog
  kubernetes.core.k8s_info:
    api_version: packages.operators.coreos.com/v1
    kind: PackageManifest
    namespace: openshift-marketplace
    name: "{{ item.package }}"
  register: _pkg_results
  loop: "{{ _operators }}"
  loop_control:
    label: "{{ item.key }}"

- name: Assert all operator packages available
  ansible.builtin.assert:
    that: item.resources | length > 0
    fail_msg: >-
      Operator '{{ item.item.key }}' (package={{ item.item.package }})
      not found in catalog {{ item.item.source }}.
  loop: "{{ _pkg_results.results }}"
  loop_control:
    label: "{{ item.item.key }}"

- name: Assert requested channels are in the catalog
  ansible.builtin.assert:
    that: item.item.channel in (item.resources[0].status.channels | default([]) | map(attribute='name') | list)
    fail_msg: >-
      Channel '{{ item.item.channel }}' of operator '{{ item.item.key }}' (package={{ item.item.package }})
      is not offered by the catalog. Available:
      {{ item.resources[0].status.channels | default([]) | map(attribute='name') | join(', ') }}.
      Pick one with -e rhoai_channel=<channel> (rhoai) or fix versions.yml.
  loop: "{{ _pkg_results.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  when: operators_validate_channels | bool

- name: Check if operator subscriptions already exist
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: Subscription
    name: "{{ item.subscription.name }}"
    namespace: "{{ item.subscription.namespace }}"
  register: _pre_sub_results
  loop: "{{ _operators }}"
  loop_control:
    label: "{{ item.subscription.name }}"

- name: Check if required CRDs already exist
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: "{{ item }}"
  register: _pre_crd_results
  loop: "{{ _operators | map(attribute='crds') | flatten | map(attribute='crd') | list }}"

- name: Reset subscription channel drift
  ansible.builtin.set_fact:
    _channel_drift: []

- name: Find subscriptions on a different channel than requested
  ansible.builtin.set_fact:
    _channel_drift: "{{ _channel_drift + [item.item.subscription.name] }}"
  loop: "{{ _pre_sub_results.results | selectattr('resources', 'defined') | list }}"
  loop_control:
    label: "{{ item.item.subscription.name }}"
  when:
    - item.resources | length > 0
    - item.resources[0].spec.channel | default('') != item.item.channel

- name: Determine if deploy is needed
  ansible.builtin.set_fact:
    _deploy_needed: >-
      {{ not (
        (_pre_sub_results.results | selectattr('resources', 'defined')
         | map(attribute='resources') | map('length') | select('equalto', 0) | list | length == 0) and
        (_pre_crd_results.results | selectattr('resources', 'defined')
         | map(attribute='resources') | map('length') | select('equalto', 0) | list | length == 0) and
        (_channel_drift | length == 0)
      ) }}

- name: "operators: subscription channel changed"
  ansible.builtin.debug:
    msg: "Subscriptions {{ _channel_drift | join(', ') }} will move to the requested channel."
  when: _channel_drift | length > 0

- name: "operators: already complete, skipping deploy."
  ansible.builtin.debug:
    msg: "operators: already complete, skipping deploy."
  when: not (_deploy_needed | bool)

- name: "operators preconditions: PASSED"
  ansible.builtin.debug:
    msg: "Cluster accessible, all {{ _operators | length }} operator packages available in catalog."
  when: _deploy_needed | bool
