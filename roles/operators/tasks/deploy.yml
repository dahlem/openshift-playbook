---
- name: Create operator namespaces
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ item }}"
  loop: "{{ _operators | map(attribute='namespaces') | flatten }}"

# Namespaces in operators_existing_operator_groups already have a compatible
# OperatorGroup; a second one would stop OLM from installing anything there.
- name: Create namespaced operator groups
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operators.coreos.com/v1
      kind: OperatorGroup
      metadata:
        name: "{{ item.subscription.namespace }}"
        namespace: "{{ item.subscription.namespace }}"
      spec: "{{ item.operator_group }}"
  loop: >-
    {{ _operators | selectattr('operator_group', 'defined')
       | rejectattr('subscription.namespace', 'in', operators_existing_operator_groups | default([]))
       | list }}
  loop_control:
    label: "{{ item.subscription.namespace }}"

- name: Create operator subscriptions
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operators.coreos.com/v1alpha1
      kind: Subscription
      metadata:
        name: "{{ item.subscription.name }}"
        namespace: "{{ item.subscription.namespace }}"
      spec:
        channel: "{{ item.channel }}"
        name: "{{ item.package }}"
        source: "{{ item.source }}"
        sourceNamespace: openshift-marketplace
  loop: "{{ _operators }}"
  loop_control:
    label: "{{ item.subscription.name }}"

- name: Wait for operator CRDs
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: "{{ item.crd }}"
  register: _crd_check
  until: _crd_check.resources | length > 0
  retries: "{{ (crd_wait_timeout | int / 10) | int }}"
  delay: 10
  loop: "{{ _operators | map(attribute='crds') | flatten }}"
  loop_control:
    label: "{{ item.label }}"
