---
# Post: DSC v2 Ready, KServe controller ready (standard / RawDeployment only)

- name: Verify DataScienceCluster
  kubernetes.core.k8s_info:
    api_version: "{{ _dsc_api_version }}"
    kind: DataScienceCluster
    name: default-dsc
  register: _dsc_post

- name: Assert DataScienceCluster Ready with KServe managed
  ansible.builtin.assert:
    that:
      - _dsc_post.resources | length > 0
      - (_dsc_post.resources[0].status.phase | default('')) == 'Ready'
      - (_dsc_post.resources[0].spec.components.kserve.managementState | default('')) == 'Managed'
    fail_msg: >-
      DataScienceCluster default-dsc is not Ready with kserve Managed
      (phase={{ _dsc_post.resources[0].status.phase | default('absent') if _dsc_post.resources else 'absent' }}).
      Check: oc get dsc default-dsc -o jsonpath='{.status.conditions}'

- name: Verify KServe CRD
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: inferenceservices.serving.kserve.io
  register: _kserve_crd

- name: Assert KServe CRD
  ansible.builtin.assert:
    that: _kserve_crd.resources | length > 0
    fail_msg: "KServe CRD not found."

- name: Verify KServe controller running
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: redhat-ods-applications
    name: kserve-controller-manager
  register: _kserve

- name: Assert KServe controller ready
  ansible.builtin.assert:
    that: >-
      _kserve.resources | length > 0 and
      (_kserve.resources[0].status.readyReplicas | default(0)) >= 1
    fail_msg: "KServe controller not ready."

- name: "ai_platform postconditions: PASSED"
  ansible.builtin.debug:
    msg: >-
      DataScienceCluster Ready ({{ _dsc_api_version }}), KServe standard deployment,
      RHOAI channel {{ rhoai_channel }}.
