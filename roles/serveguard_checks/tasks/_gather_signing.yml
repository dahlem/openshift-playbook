---
# Read-only, local: which <role>.key / <role>.pub files already exist. The operator key
# signs the trust anchor in every mode; publisher and verifier keys in keypair mode.
- name: Find existing signing keys
  ansible.builtin.find:
    paths: "{{ _sg_workload.signing_keys_dir | default('') }}"
    patterns: ["{{ item }}.key", "{{ item }}.pub"]
  register: _sg_keys
  loop: [operator, publisher, verifier]
  when: (_sg_workload.signing_keys_dir | default('')) is directory

- name: Collect signing facts
  ansible.builtin.set_fact:
    _sg_raw_signing:
      keys: >-
        {{ dict(_sg_keys.results | default([]) | map(attribute='item')
                | zip(_sg_keys.results | default([]) | map(attribute='files', default=[]) | map('map', attribute='path') | map('list'))) }}
