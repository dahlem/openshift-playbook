---
- name: "pre storage: read state"
  ansible.builtin.include_tasks: _gather_storage.yml
  when: serveguard_checks_fixtures is not defined

# Offline tests (tests/serveguard) supply the gathered state instead.
- name: "pre storage: state from fixtures"
  ansible.builtin.set_fact:
    _sg_raw_storage: "{{ serveguard_checks_fixtures.storage }}"
  when: serveguard_checks_fixtures is defined

- name: "pre storage: decide"
  ansible.builtin.include_tasks: _evaluate_storage.yml
