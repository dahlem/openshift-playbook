---
# Read-only, local: find the serveguard.openshift_ai collection and read its role
# defaults, the single source of the workload's resource requests.

- name: Find the serveguard collection
  ansible.builtin.command: ansible-galaxy collection list {{ serveguard_collection }} --format json
  register: _sg_coll_list
  changed_when: false
  failed_when: false

- name: Locate the collection
  ansible.builtin.set_fact:
    _sg_coll: "{{ (_sg_coll_list.stdout | from_json) | sg_collection_location(serveguard_collection) if _sg_coll_list.rc == 0 else none }}"

# Read as plain YAML (not include_vars): the values template each other and the
# environment, and must not become play variables of this repository.
- name: Read the collection's role defaults
  ansible.builtin.set_fact:
    "_sg_coll_defaults_{{ item }}": >-
      {{ lookup('ansible.builtin.file', _sg_coll.path ~ '/roles/' ~ item ~ '/defaults/main.yml')
         | from_yaml | default({}, true) }}
  loop: "{{ serveguard_collection_roles }}"
  when:
    - _sg_coll is not none
    - (_sg_coll.path ~ '/roles/' ~ item ~ '/defaults/main.yml') is file

- name: Collect workload facts
  ansible.builtin.set_fact:
    _sg_raw_workload:
      collection: "{{ _sg_coll }}"
      defaults: >-
        {{ serveguard_collection_roles | map('regex_replace', '^', '_sg_coll_defaults_')
           | map('extract', vars) | select('defined') | select('mapping') | list
           | sg_merge_dicts | sg_resolve_defaults(_sg_overrides) }}
      overrides: "{{ _sg_overrides }}"
  vars:
    _sg_overrides: "{{ serveguard_workload_vars.values() | list | sg_defined_vars(vars) }}"
