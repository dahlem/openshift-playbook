---
# The demo-level postcondition of the serving_consumer role, asserted on its result
# rather than re-read from the cluster. serveguard_serving_result =
#   {inference_service, adapter_ref, ready, guard_exit_code, annotations}
# adapter_ref is the digest-pinned SERVEGUARD_ADAPTER_REF the guard pulled and checked
# (null without the supply chain). With the supply chain it must equal the publisher's
# serveguard_adapter_ref, here and again after the stories (_sg_digest_before set).
# Without it (a collection predating ADR-0001), the serveguard.dahlem.github.io/ verdict
# annotations carry the verdict and the adapter digest instead.

- name: Assert the serving consumer's result
  ansible.builtin.assert:
    that:
      - serveguard_serving_result is defined
      - serveguard_serving_result.ready | default(false) | bool
      - serveguard_serving_result.guard_exit_code | default(-1) | int == 0
      # supply chain: the served reference is the published one
      - not _sg_sc or (serveguard_serving_result.adapter_ref | default('', true)) is match(_sg_ref)
      - not _sg_sc or serveguard_serving_result.adapter_ref == serveguard_adapter_ref | default('')
      # pre-supply-chain collection: the verdict annotations
      - _sg_sc or _sg_annotations[_sg_prefix ~ 'admitted'] | default('') == 'true'
      - _sg_sc or _sg_verdict_missing | length == 0
      - _sg_digest_before | default('') | length == 0 or _sg_digest_now == _sg_digest_before
    fail_msg: >-
      ServeGuard serving postcondition failed for
      {{ serveguard_serving_result.inference_service | default('the InferenceService') }}:
      ready={{ serveguard_serving_result.ready | default('undefined') }},
      guard exit={{ serveguard_serving_result.guard_exit_code | default('undefined') }},
      {{ ('served adapter_ref=' ~ (serveguard_serving_result.adapter_ref | default('none', true))
          ~ ' (published ' ~ (serveguard_adapter_ref | default('undefined')) ~ ')')
         if _sg_sc else
         ('admitted=' ~ _sg_annotations[_sg_prefix ~ 'admitted'] | default('absent')
          ~ ', missing verdict annotations=' ~ (_sg_verdict_missing | join(','))) }}
      {{ ', adapter changed ' ~ _sg_digest_before ~ ' -> ' ~ _sg_digest_now
         if (_sg_digest_before | default('') | length > 0 and _sg_digest_now != _sg_digest_before) else '' }}
  vars:
    _sg_sc: "{{ _sg_workload.supply_chain | default(false) | bool }}"
    _sg_prefix: serveguard.dahlem.github.io/
    _sg_ref: '^oci://[^@\s]+@sha256:[0-9a-f]{64}$'
    _sg_annotations: "{{ serveguard_serving_result.annotations | default({}, true) }}"
    _sg_verdict_missing: >-
      {{ ['adapter-digest', 'package-root', 'base-hash'] | map('regex_replace', '^', _sg_prefix)
         | reject('in', _sg_annotations | dict2items | rejectattr('value', 'falsy') | map(attribute='key') | list)
         | list }}
    _sg_digest_now: >-
      {{ serveguard_serving_result.adapter_ref | default('', true) if _sg_sc
         else _sg_annotations[_sg_prefix ~ 'adapter-digest'] | default('') }}

- name: Remember the served adapter (digest-pinned ref with the supply chain)
  ansible.builtin.set_fact:
    _sg_admitted_digest: >-
      {{ serveguard_serving_result.adapter_ref
         if (_sg_workload.supply_chain | default(false) | bool)
         else serveguard_serving_result.annotations['serveguard.dahlem.github.io/adapter-digest'] }}
