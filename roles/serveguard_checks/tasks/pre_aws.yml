---
- name: "pre aws: read state"
  ansible.builtin.include_tasks: _gather_aws.yml
  when: serveguard_checks_fixtures is not defined

# Offline tests (tests/serveguard) supply the gathered state instead.
- name: "pre aws: state from fixtures"
  ansible.builtin.set_fact:
    _sg_raw_aws: "{{ serveguard_checks_fixtures.aws }}"
  when: serveguard_checks_fixtures is defined

- name: "pre aws: decide"
  ansible.builtin.include_tasks: _evaluate_aws.yml
