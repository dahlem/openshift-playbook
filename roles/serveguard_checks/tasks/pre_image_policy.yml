---
- name: "pre image policy: read state"
  ansible.builtin.include_tasks: _gather_image_policy.yml
  when: serveguard_checks_fixtures is not defined

# Offline tests (tests/serveguard) supply the gathered state instead.
- name: "pre image policy: state from fixtures"
  ansible.builtin.set_fact:
    _sg_raw_image_policy: "{{ serveguard_checks_fixtures.image_policy }}"
  when: serveguard_checks_fixtures is defined

- name: "pre image policy: decide"
  ansible.builtin.include_tasks: _evaluate_image_policy.yml
