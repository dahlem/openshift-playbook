---
# One requirement record per enabled operator, from the same data the operators
# role installs from (versions.yml + roles/operators/defaults/main.yml).

- name: Load the operators install topology
  ansible.builtin.include_vars:
    file: "{{ role_path }}/../operators/defaults/main.yml"
  when: operators_install is not defined

- name: Reset operator requirements
  ansible.builtin.set_fact:
    _sg_operator_reqs: []

- name: Build operator requirements
  ansible.builtin.set_fact:
    _sg_operator_reqs: >-
      {{ _sg_operator_reqs + [{
           'key': item,
           'package': versions.operators[item].package,
           'source': versions.operators[item].source,
           'channel': rhoai_channel if item == 'rhoai' else versions.operators[item].channel,
           'namespace': operators_install[item].subscription.namespace,
           'sub_name': operators_install[item].subscription.name,
           'og_spec': operators_install[item].operator_group | default(none),
           'allow_channel_change': serveguard_allow_channel_change | bool }] }}
  loop: "{{ operators_enabled + _sg_supply_chain_operators }}"
  vars:
    # Mode-selected supply-chain prerequisites (ADR-0001): never part of a scenario's list.
    _sg_supply_chain_operators: >-
      {{ (['rhtas'] if (_sg_workload.signing_mode | default('keypair')) == 'keyless' else [])
         + (['kyverno'] if ((_sg_workload.enforcer | default('vap')) == 'kyverno'
                           and (_sg_kyverno.action | default('install')) != 'accept') else []) }}
