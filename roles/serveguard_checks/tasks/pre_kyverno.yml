---
- name: Load the operators install topology
  ansible.builtin.include_vars:
    file: "{{ role_path }}/../operators/defaults/main.yml"
  when: operators_install is not defined

- name: "pre kyverno: read state"
  ansible.builtin.include_tasks: _gather_kyverno.yml
  when: serveguard_checks_fixtures is not defined

# Offline tests (tests/serveguard) supply the gathered state instead.
- name: "pre kyverno: state from fixtures"
  ansible.builtin.set_fact:
    _sg_raw_kyverno: "{{ serveguard_checks_fixtures.kyverno }}"
  when: serveguard_checks_fixtures is defined

- name: "pre kyverno: decide"
  ansible.builtin.include_tasks: _evaluate_kyverno.yml
