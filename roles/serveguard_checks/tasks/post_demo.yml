---
# Post: the receiver-written InferenceService is Ready with its verdict, the
# policy and binding exist, the predictor runs and its guard exited 0.
- name: "post demo: wait for the InferenceService"
  block:
    - name: Wait for InferenceService Ready
      kubernetes.core.k8s_info:
        api_version: serving.kserve.io/v1beta1
        kind: InferenceService
        namespace: "{{ serveguard_namespace }}"
        name: "{{ serveguard_isvc }}"
      register: _sg_wait
      until: >-
        _sg_wait.resources | length > 0 and
        (_sg_wait.resources[0].status.conditions | default([])
         | selectattr('type', 'equalto', 'Ready') | selectattr('status', 'equalto', 'True') | list | length > 0)
      retries: "{{ (serveguard_wait_isvc | int / 10) | int }}"
      delay: 10
  rescue:
    - name: Diagnose the demo
      ansible.builtin.include_tasks: _diagnose.yml
      vars:
        _sg_diag_title: "InferenceService {{ serveguard_namespace }}/{{ serveguard_isvc }} not Ready within {{ serveguard_wait_isvc }}s"
        _sg_diag_cmds: "{{ _sg_demo_diag }}"

- name: "post demo: re-read and decide"
  ansible.builtin.include_tasks: _gather_demo_post.yml

- name: "post demo: evaluate"
  ansible.builtin.include_tasks: _evaluate_demo_post.yml
  vars:
    serveguard_checks_mode: report

- name: Diagnose a failed demo postcondition
  ansible.builtin.include_tasks: _diagnose.yml
  vars:
    _sg_diag_title: "demo postconditions failed: {{ _sg_result.rows | selectattr('status', 'equalto', 'fail') | map(attribute='check') | join(', ') }}"
    _sg_diag_cmds: "{{ _sg_demo_diag }}"
  when: _sg_result.rows | selectattr('status', 'in', ['fail', 'conflict']) | list | length > 0
