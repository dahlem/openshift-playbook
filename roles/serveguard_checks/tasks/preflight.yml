---
# Every platform precondition, read-only, in deploy order (print with report.yml). The
# workload's own preconditions are the collection's preflight role.
# Used by playbooks/serveguard-demo-preflight.yml (serveguard_checks_mode: report).
- name: Local tools
  ansible.builtin.include_tasks: pre_local.yml
- name: Workload requests (serveguard.openshift_ai defaults)
  ansible.builtin.include_tasks: pre_workload.yml
- name: Approved SRS (local)
  ansible.builtin.include_tasks: pre_srs.yml
- name: AWS account
  ansible.builtin.include_tasks: pre_aws.yml
- name: Cluster
  ansible.builtin.include_tasks: pre_cluster.yml
- name: OpenShift version for a new cluster
  ansible.builtin.include_tasks: pre_versions.yml
- name: Cluster (with the chosen version)
  ansible.builtin.include_tasks: pre_cluster.yml
- name: Serving pool
  ansible.builtin.include_tasks: pre_pool.yml
- name: Quotas and instance types
  ansible.builtin.include_tasks: pre_quota.yml
- name: Signing mode and enforcer
  ansible.builtin.include_tasks: pre_signing.yml
- name: Kyverno (enforcer kyverno)
  ansible.builtin.include_tasks: pre_kyverno.yml
- name: Operators
  ansible.builtin.include_tasks: pre_operators.yml
- name: RHTAS (keyless)
  ansible.builtin.include_tasks: pre_rhtas.yml
- name: ClusterImagePolicy (opt-in)
  ansible.builtin.include_tasks: pre_image_policy.yml
- name: GPU stack
  ansible.builtin.include_tasks: pre_gpu_stack.yml
  when: serveguard_accelerator == 'nvidia'
- name: DataScienceCluster
  ansible.builtin.include_tasks: pre_platform.yml
- name: Internal image registry
  ansible.builtin.include_tasks: pre_registry.yml
- name: Storage
  ansible.builtin.include_tasks: pre_storage.yml
- name: Capacity
  ansible.builtin.include_tasks: pre_capacity.yml
