---
- name: Evaluate the demo
  ansible.builtin.set_fact:
    _sg_result: >-
      {{ _sg_raw_demo | sg_eval_demo({
           'integration_dir': serveguard_integration_dir,
           'namespace': serveguard_namespace,
           'isvc': serveguard_isvc,
           'accelerator': serveguard_accelerator,
           'redeploy': serveguard_redeploy | bool,
           'predictor_cpu': serveguard_predictor_cpu,
           'predictor_memory': serveguard_predictor_memory,
           'predictor_defaults': {'cpu': '4', 'memory': '8Gi'},
           'make_params': {'cpu': serveguard_make_param_predictor_cpu,
                           'memory': serveguard_make_param_predictor_memory} }) }}

- name: Keep the demo decision
  ansible.builtin.set_fact:
    _sg_demo: "{{ _sg_result }}"

- name: Record demo checks
  ansible.builtin.include_tasks: _record.yml
