---
- name: "pre gpu stack: read state"
  ansible.builtin.include_tasks: _gather_gpu_stack.yml
  when: serveguard_checks_fixtures is not defined

# Offline tests (tests/serveguard) supply the gathered state instead.
- name: "pre gpu stack: state from fixtures"
  ansible.builtin.set_fact:
    _sg_raw_gpu_stack: "{{ serveguard_checks_fixtures.gpu_stack }}"
  when: serveguard_checks_fixtures is defined

- name: "pre gpu stack: decide"
  ansible.builtin.include_tasks: _evaluate_gpu_stack.yml
