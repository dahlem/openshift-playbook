---
- name: Read StorageClasses
  kubernetes.core.k8s_info:
    api_version: storage.k8s.io/v1
    kind: StorageClass
  register: _sg_scs
  when: _sg_cluster_reachable | bool

- name: Collect storage facts
  ansible.builtin.set_fact:
    _sg_raw_storage:
      cluster_reachable: "{{ _sg_cluster_reachable | bool }}"
      storage_classes: "{{ _sg_scs.resources | default([]) }}"
