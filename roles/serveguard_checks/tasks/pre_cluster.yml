---
- name: "pre cluster: read state"
  ansible.builtin.include_tasks: _gather_cluster.yml
  when: serveguard_checks_fixtures is not defined

# Offline tests (tests/serveguard) supply the gathered state instead.
- name: "pre cluster: state from fixtures"
  ansible.builtin.set_fact:
    _sg_raw_cluster: "{{ serveguard_checks_fixtures.cluster }}"
    _sg_cluster_reachable: "{{ serveguard_checks_fixtures.cluster_reachable | bool }}"
  when: serveguard_checks_fixtures is defined

- name: "pre cluster: decide"
  ansible.builtin.include_tasks: _evaluate_cluster.yml
