---
- name: "pre demo: read state"
  ansible.builtin.include_tasks: _gather_demo.yml
  when: serveguard_checks_fixtures is not defined

# Offline tests (tests/serveguard) supply the gathered state instead.
- name: "pre demo: state from fixtures"
  ansible.builtin.set_fact:
    _sg_raw_demo: "{{ serveguard_checks_fixtures.demo }}"
  when: serveguard_checks_fixtures is defined

- name: "pre demo: decide"
  ansible.builtin.include_tasks: _evaluate_demo.yml
