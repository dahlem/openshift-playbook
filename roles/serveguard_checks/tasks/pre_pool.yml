---
- name: "pre pool: read state"
  ansible.builtin.include_tasks: _gather_pool.yml
  when: serveguard_checks_fixtures is not defined

# Offline tests (tests/serveguard) supply the gathered state instead.
- name: "pre pool: state from fixtures"
  ansible.builtin.set_fact:
    _sg_raw_pool: "{{ serveguard_checks_fixtures.pool }}"
  when: serveguard_checks_fixtures is defined

- name: "pre pool: decide"
  ansible.builtin.include_tasks: _evaluate_pool.yml
